<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e55151;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#DAA520"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc3838" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc3838" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="760.0487573009469" cy="842.5259355581516" r="10.3869670765486" fill="#FF4500"/><circle cx="437.88089620972335" cy="894.6069837461843" r="5.63852179168393" fill="#FF4500"/><circle cx="836.2338844100699" cy="830.3374976499748" r="8.722501175718783" fill="#FF4500"/><circle cx="52.523558527629575" cy="933.1317179200928" r="8.376555510730936" fill="#FF4500"/><circle cx="94.74207258423739" cy="935.9243366671151" r="10.681975908520693" fill="#FF4500"/><circle cx="59.12802197115874" cy="920.8151345092532" r="12.15277894116404" fill="#FF4500"/><circle cx="123.4113936383412" cy="830.2196873488917" r="11.066445547823104" fill="#FF4500"/><circle cx="124.84387956186383" cy="971.9970308824329" r="14.503154528393228" fill="#FF4500"/><circle cx="668.3794835214366" cy="822.2022120106458" r="5.326413218083948" fill="#FF4500"/><circle cx="767.2312481569768" cy="858.5978633910912" r="8.698624587715681" fill="#FF4500"/><circle cx="870.9439284424716" cy="996.567427716978" r="6.14837858805072" fill="#FF4500"/><circle cx="329.41666866532125" cy="936.852714987396" r="13.77513514897197" fill="#FF4500"/><circle cx="894.2650950602151" cy="842.8854751104199" r="14.582109268387617" fill="#FF4500"/><circle cx="245.3210365988825" cy="907.2674575076476" r="7.978180666726709" fill="#FF4500"/><circle cx="165.2599651155242" cy="866.6860389669317" r="13.694686137588786" fill="#FF4500"/><circle cx="723.8957646189772" cy="996.4300063127124" r="10.76990626034088" fill="#FF4500"/><circle cx="955.1386105154471" cy="969.6174083431604" r="11.255121763129779" fill="#FF4500"/><circle cx="785.3401078866375" cy="837.7298421958831" r="14.46080287488172" fill="#FF4500"/><circle cx="831.4591540772726" cy="980.1599443373736" r="11.662978414345398" fill="#FF4500"/><circle cx="885.1639411533209" cy="807.3075832168979" r="6.007278030559737" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9012
  </text>

  
</svg>