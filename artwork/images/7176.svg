<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Smartphone --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="210.80506313898772" cy="846.7341183281058" r="13.517017568522121" fill="#FF4500"/><circle cx="848.5206100733718" cy="859.8570182615603" r="8.70728398066742" fill="#FF4500"/><circle cx="773.5839092709791" cy="844.7607906225774" r="14.83445642280056" fill="#FF4500"/><circle cx="584.2822384516111" cy="930.9372374588381" r="8.811603395263782" fill="#FF4500"/><circle cx="147.38298780728988" cy="854.2864800743353" r="11.15472318004922" fill="#FF4500"/><circle cx="841.7552637141179" cy="899.7000744039735" r="12.822533395936437" fill="#FF4500"/><circle cx="969.4051370193926" cy="839.5008566689545" r="6.822397839240053" fill="#FF4500"/><circle cx="759.1291822048191" cy="823.3095155241128" r="5.900258084080021" fill="#FF4500"/><circle cx="617.3198722149791" cy="875.1835801868336" r="11.773123353180166" fill="#FF4500"/><circle cx="380.2358302940878" cy="987.3729739241579" r="12.395996806024117" fill="#FF4500"/><circle cx="677.8507237178153" cy="800.1613394259294" r="12.282885202397797" fill="#FF4500"/><circle cx="831.6589078704612" cy="841.9103468956071" r="13.998905387170378" fill="#FF4500"/><circle cx="554.2052546036" cy="828.4360483152424" r="5.4045800684464185" fill="#FF4500"/><circle cx="606.2658182148913" cy="896.0336427681987" r="10.79854314373425" fill="#FF4500"/><circle cx="579.304280311864" cy="972.485944345018" r="11.212314228353854" fill="#FF4500"/><circle cx="45.80828885471333" cy="901.5812894989498" r="13.311761182340982" fill="#FF4500"/><circle cx="637.024288142926" cy="932.6596943771239" r="13.794814441423354" fill="#FF4500"/><circle cx="386.55076450054395" cy="929.174522173307" r="12.1282405320259" fill="#FF4500"/><circle cx="555.7709199288337" cy="829.5114306714622" r="13.43336285838575" fill="#FF4500"/><circle cx="170.2914416190162" cy="990.6382330201999" r="5.151930020659976" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #7176
  </text>

  
</svg>