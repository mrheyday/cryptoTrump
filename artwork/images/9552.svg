<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="365.1609639005275" cy="975.1501392829716" r="14.499688975137488" fill="#FF4500"/><circle cx="954.3898220535314" cy="945.1159654986777" r="9.01018360971591" fill="#FF4500"/><circle cx="313.83424286859184" cy="877.4667342972017" r="6.948887097616716" fill="#FF4500"/><circle cx="880.2215216672851" cy="935.9761356138904" r="14.168774309169365" fill="#FF4500"/><circle cx="522.3506982214752" cy="953.1083029673201" r="12.190405138224493" fill="#FF4500"/><circle cx="556.8605710729639" cy="992.1810808943051" r="14.304695626477935" fill="#FF4500"/><circle cx="726.7904720499146" cy="951.751031540467" r="7.649740893864136" fill="#FF4500"/><circle cx="464.70380242957043" cy="924.1062324467639" r="12.4994726860048" fill="#FF4500"/><circle cx="572.5484249609432" cy="905.9405009220428" r="14.100514659925615" fill="#FF4500"/><circle cx="790.7615131468361" cy="830.4187778826584" r="12.692124655369907" fill="#FF4500"/><circle cx="841.8262947719129" cy="939.0773923536913" r="10.612465244910549" fill="#FF4500"/><circle cx="986.2706950709272" cy="885.6093673288879" r="11.448379508284958" fill="#FF4500"/><circle cx="577.2815517689091" cy="982.7640502876025" r="5.043216370325103" fill="#FF4500"/><circle cx="223.43804601392912" cy="887.2768245283736" r="10.05060095430677" fill="#FF4500"/><circle cx="986.7441568530102" cy="861.6004991380169" r="12.375837496648735" fill="#FF4500"/><circle cx="752.5995734007238" cy="969.1764508328891" r="6.055424198761954" fill="#FF4500"/><circle cx="401.4491265221647" cy="898.9391806905924" r="11.544964611887432" fill="#FF4500"/><circle cx="200.10341235210706" cy="802.0492206522737" r="5.694383640095748" fill="#FF4500"/><circle cx="477.1441922064097" cy="836.2661903299002" r="7.708196560387137" fill="#FF4500"/><circle cx="834.6240825076331" cy="930.1029256042675" r="12.313653490941121" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9552
  </text>

  
</svg>