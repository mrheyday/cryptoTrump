<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="773.2873629157366" cy="891.9528068795165" r="9.20204775481379" fill="#FF4500"/><circle cx="729.1801401689884" cy="804.9720964758989" r="6.031123816146781" fill="#FF4500"/><circle cx="412.4221253789675" cy="849.996454646684" r="13.570725261162721" fill="#FF4500"/><circle cx="36.62062539619715" cy="893.159142605476" r="7.6565704010907565" fill="#FF4500"/><circle cx="480.30623337895497" cy="841.3770208139618" r="14.228976209407659" fill="#FF4500"/><circle cx="615.1169213458851" cy="994.9905999637684" r="8.13061928008505" fill="#FF4500"/><circle cx="22.108593907282923" cy="943.0848809577984" r="6.1235085953781665" fill="#FF4500"/><circle cx="662.1248710941743" cy="800.8097101275962" r="14.69856582230944" fill="#FF4500"/><circle cx="485.69696904548" cy="810.7281813067127" r="9.151850810083237" fill="#FF4500"/><circle cx="779.3678490159941" cy="855.2106599694703" r="12.386085706629636" fill="#FF4500"/><circle cx="133.1013619547854" cy="888.3425457475022" r="13.607534694656692" fill="#FF4500"/><circle cx="105.8774337495636" cy="844.8149679330671" r="11.644740661783327" fill="#FF4500"/><circle cx="317.5485422600195" cy="891.7868985026448" r="9.24034919248642" fill="#FF4500"/><circle cx="686.1464128195394" cy="950.891590309968" r="14.476180541892994" fill="#FF4500"/><circle cx="346.843669434904" cy="905.1207107317261" r="11.606345813051842" fill="#FF4500"/><circle cx="483.940085189303" cy="958.4523938763157" r="8.10682535764371" fill="#FF4500"/><circle cx="254.2078773063634" cy="925.982801602067" r="10.852715421831647" fill="#FF4500"/><circle cx="31.543703507776577" cy="801.4488127190209" r="14.53501344743347" fill="#FF4500"/><circle cx="240.71922508694522" cy="808.7948026859196" r="13.40023215618794" fill="#FF4500"/><circle cx="4.561200019045586" cy="936.7012374899889" r="7.181127555545997" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #1094
  </text>

  
</svg>