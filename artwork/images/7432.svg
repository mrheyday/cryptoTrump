<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#003366"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#8B4513" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#651f00" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#651f00" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="849.711026221911" cy="906.3146291428244" r="11.341222581576947" fill="#FF4500"/><circle cx="656.3850034576046" cy="874.3800481235003" r="8.024747696127108" fill="#FF4500"/><circle cx="728.7881780438545" cy="963.4439981346301" r="5.485404246539362" fill="#FF4500"/><circle cx="893.2976452792356" cy="945.4763966582536" r="8.900364352090403" fill="#FF4500"/><circle cx="995.0909431453458" cy="904.3163084313087" r="8.47647173433442" fill="#FF4500"/><circle cx="803.3631961732438" cy="827.2724084317923" r="5.855122829570913" fill="#FF4500"/><circle cx="882.2763157949871" cy="930.5098849545159" r="12.484595806836971" fill="#FF4500"/><circle cx="928.0071309624052" cy="852.1266475967778" r="8.220071805298767" fill="#FF4500"/><circle cx="70.07491534780019" cy="811.259276975097" r="14.548699949315187" fill="#FF4500"/><circle cx="608.866169223736" cy="806.7669725997492" r="14.786017639811273" fill="#FF4500"/><circle cx="151.32929917080128" cy="957.8102426753786" r="10.60676176824159" fill="#FF4500"/><circle cx="252.62570061848842" cy="908.1668918312711" r="8.161195990594532" fill="#FF4500"/><circle cx="744.5092927643071" cy="936.8861497626119" r="6.2066447022271065" fill="#FF4500"/><circle cx="61.335355788195265" cy="849.9025865168471" r="8.218353529517655" fill="#FF4500"/><circle cx="150.24217406274576" cy="899.3326912811942" r="10.579818675675599" fill="#FF4500"/><circle cx="645.4249225641446" cy="943.4561875135329" r="7.331409263238022" fill="#FF4500"/><circle cx="950.313151131649" cy="972.5580711118124" r="14.603226360346655" fill="#FF4500"/><circle cx="477.0557493168859" cy="873.5740857065613" r="7.59333324416132" fill="#FF4500"/><circle cx="333.72959069613574" cy="893.7997206218471" r="7.345980324572348" fill="#FF4500"/><circle cx="521.9909242592242" cy="984.5045646207041" r="7.862583246256609" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #7432
  </text>

  
</svg>