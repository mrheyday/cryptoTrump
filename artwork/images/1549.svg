<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,430 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="433.11330374569843" cy="904.8976921702333" r="11.973418769765107" fill="#FF4500"/><circle cx="650.4111801020678" cy="819.8749793187967" r="13.645612734213033" fill="#FF4500"/><circle cx="422.38096519858215" cy="892.3897928736021" r="11.400409072036036" fill="#FF4500"/><circle cx="314.45532799306665" cy="855.7541538045834" r="14.28254249273268" fill="#FF4500"/><circle cx="68.46514554977045" cy="869.3323288674319" r="6.018430799412624" fill="#FF4500"/><circle cx="132.9056766499581" cy="970.1460094995435" r="5.9676934637075725" fill="#FF4500"/><circle cx="489.18238458372775" cy="998.1944702851272" r="8.508888663041725" fill="#FF4500"/><circle cx="543.3397071976385" cy="861.9436649148378" r="6.592956871782343" fill="#FF4500"/><circle cx="137.35446117098337" cy="860.8234470901467" r="14.491446483727543" fill="#FF4500"/><circle cx="536.6222320583367" cy="969.7472735155154" r="10.453019310982231" fill="#FF4500"/><circle cx="628.8462941840454" cy="816.9811307309142" r="8.70396504378553" fill="#FF4500"/><circle cx="374.22048084660366" cy="890.0393592538414" r="12.914035440954548" fill="#FF4500"/><circle cx="131.48574883169852" cy="833.1893862499484" r="9.270126342258154" fill="#FF4500"/><circle cx="577.814479940183" cy="942.448169824639" r="13.413920463720363" fill="#FF4500"/><circle cx="444.234721113389" cy="991.836817871581" r="7.837321997670088" fill="#FF4500"/><circle cx="375.0549717005782" cy="944.9170963719741" r="12.3992283451944" fill="#FF4500"/><circle cx="665.5764959455195" cy="806.8046122546009" r="9.278189170524886" fill="#FF4500"/><circle cx="832.3703184027825" cy="837.5223763828154" r="10.127067089454158" fill="#FF4500"/><circle cx="446.4402491900887" cy="868.8885131051571" r="13.258767160436252" fill="#FF4500"/><circle cx="251.17375932110963" cy="917.5377135466305" r="13.586755926151888" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #1549
  </text>

  
</svg>