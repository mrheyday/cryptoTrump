<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#003366"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <rect x="410" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <rect x="520" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <line x1="480" y1="330" x2="520" y2="330" stroke="#000000" stroke-width="3"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="938.3370388275796" cy="914.310397577636" r="10.22534500975802" fill="#FF4500"/><circle cx="970.9929306857024" cy="856.6056777849084" r="7.07355317682576" fill="#FF4500"/><circle cx="844.7927659623855" cy="959.1066396769926" r="5.088821567293767" fill="#FF4500"/><circle cx="101.49874534226355" cy="877.7038209868731" r="11.831222975461742" fill="#FF4500"/><circle cx="234.4359226572006" cy="852.908606953762" r="7.4355909140414544" fill="#FF4500"/><circle cx="630.2308008480705" cy="959.3996125300496" r="14.624870292698555" fill="#FF4500"/><circle cx="516.9143983048476" cy="996.6762909257659" r="13.240555910753269" fill="#FF4500"/><circle cx="938.0208433542194" cy="819.3363243798982" r="8.246702452870863" fill="#FF4500"/><circle cx="297.73765617305827" cy="892.8141454148424" r="14.938996115133065" fill="#FF4500"/><circle cx="70.45166441042761" cy="938.5969010291578" r="12.543937701526808" fill="#FF4500"/><circle cx="299.47135000294645" cy="967.8967084146149" r="7.036238096720718" fill="#FF4500"/><circle cx="965.98218869939" cy="813.1068426812183" r="9.550612475965558" fill="#FF4500"/><circle cx="490.69820663483864" cy="966.2177053406399" r="9.907329282780957" fill="#FF4500"/><circle cx="881.6975016009263" cy="802.6593118387271" r="5.456483468913628" fill="#FF4500"/><circle cx="336.6642748458033" cy="940.3093321338423" r="7.075668794200711" fill="#FF4500"/><circle cx="196.65745418105195" cy="818.6574474539403" r="10.075965354767709" fill="#FF4500"/><circle cx="865.6162863894168" cy="938.1924134250113" r="7.042982162833007" fill="#FF4500"/><circle cx="679.068665265187" cy="930.9167442876322" r="9.40188946686262" fill="#FF4500"/><circle cx="607.5446248670858" cy="949.5463449810352" r="5.043265642730866" fill="#FF4500"/><circle cx="215.81834121174936" cy="948.1125246448945" r="6.352401188532899" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4076
  </text>

  
</svg>