<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#DAA520"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#36454F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#101f29" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#101f29" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="654.7813894092523" cy="939.2528528714304" r="9.51142143982173" fill="#FF4500"/><circle cx="832.0733214449352" cy="955.939206658046" r="13.377602375404942" fill="#FF4500"/><circle cx="217.93721329674833" cy="808.8612775238613" r="9.110110599331822" fill="#FF4500"/><circle cx="732.858079508417" cy="935.5508445899299" r="7.970151481776986" fill="#FF4500"/><circle cx="802.9151949964071" cy="845.8664114787886" r="10.449629441192377" fill="#FF4500"/><circle cx="490.1670458266285" cy="856.0416863543217" r="11.68366245062732" fill="#FF4500"/><circle cx="633.0272784986493" cy="970.8902317715296" r="11.120250354893857" fill="#FF4500"/><circle cx="167.69392183549024" cy="881.8711362018634" r="9.267670584990492" fill="#FF4500"/><circle cx="191.64142547374018" cy="914.4818021707483" r="9.128611338248456" fill="#FF4500"/><circle cx="789.3481025629108" cy="931.4933311121848" r="13.298962460079204" fill="#FF4500"/><circle cx="878.0127032685414" cy="873.0565407496512" r="6.173737480816053" fill="#FF4500"/><circle cx="847.2753039526948" cy="990.9783648882088" r="10.31325740477103" fill="#FF4500"/><circle cx="727.5566131750446" cy="822.5155635344657" r="12.717277542121819" fill="#FF4500"/><circle cx="747.089934478373" cy="939.3831439925959" r="7.93332305620519" fill="#FF4500"/><circle cx="774.9511901675829" cy="809.193051484464" r="5.605227039902594" fill="#FF4500"/><circle cx="721.4989978558724" cy="863.9337753992677" r="8.659388177041425" fill="#FF4500"/><circle cx="867.1066977527257" cy="916.6089554399875" r="10.11242295454809" fill="#FF4500"/><circle cx="923.895003669285" cy="905.7442167071041" r="9.00089615166179" fill="#FF4500"/><circle cx="818.9381134800097" cy="884.8680700555208" r="8.575025915614043" fill="#FF4500"/><circle cx="836.705937474308" cy="925.6566089928934" r="10.26425249803659" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #8852
  </text>

  
</svg>