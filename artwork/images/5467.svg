<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cca400;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#355E3B"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d9b100" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <rect x="410" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <rect x="520" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <line x1="480" y1="330" x2="520" y2="330" stroke="#000000" stroke-width="3"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="546.7241911967237" cy="919.1524240292683" r="9.465170645939374" fill="#FF4500"/><circle cx="823.7849212333119" cy="882.1181485143047" r="7.948423696125236" fill="#FF4500"/><circle cx="113.09966511404323" cy="981.9987236972098" r="6.866257359361092" fill="#FF4500"/><circle cx="535.315477184552" cy="972.384821848946" r="9.275904629109473" fill="#FF4500"/><circle cx="376.0960318205933" cy="964.1803233971032" r="6.320262459683903" fill="#FF4500"/><circle cx="203.41077075796156" cy="853.1547145770517" r="6.378155558547835" fill="#FF4500"/><circle cx="367.2306270805012" cy="917.7767257686805" r="5.784328147565843" fill="#FF4500"/><circle cx="41.80031623685964" cy="979.4089551098155" r="7.655518441808211" fill="#FF4500"/><circle cx="141.6051973945014" cy="985.5341563703158" r="7.310890024176288" fill="#FF4500"/><circle cx="497.1044468377705" cy="870.34044548766" r="14.947672058435039" fill="#FF4500"/><circle cx="737.5101929403471" cy="810.4583098577621" r="11.011470368622444" fill="#FF4500"/><circle cx="937.0600602612622" cy="821.5344292663577" r="8.435002995594616" fill="#FF4500"/><circle cx="433.8892533328358" cy="882.2792606128697" r="9.826343665781046" fill="#FF4500"/><circle cx="193.08136231648666" cy="800.1217911747167" r="9.728264472188417" fill="#FF4500"/><circle cx="182.21684194338738" cy="992.1617815643682" r="5.905193758789262" fill="#FF4500"/><circle cx="724.4791557665427" cy="833.6395626263374" r="8.75300890569671" fill="#FF4500"/><circle cx="940.1449283146237" cy="957.4753129094977" r="12.491340008645462" fill="#FF4500"/><circle cx="674.581306565152" cy="814.8241998220146" r="12.341588708928741" fill="#FF4500"/><circle cx="217.0786119057737" cy="860.9869899649575" r="12.885158432797056" fill="#FF4500"/><circle cx="49.248868905650944" cy="835.5148293262162" r="5.806468477025561" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5467
  </text>

  
</svg>