<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FFD700"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- American Flag Pin --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="993.118460017679" cy="873.8603188750725" r="10.301103410257731" fill="#FF4500"/><circle cx="277.64861370784865" cy="880.5507339289882" r="10.09938879633275" fill="#FF4500"/><circle cx="788.4638103254724" cy="972.6726671996825" r="8.928907772965955" fill="#FF4500"/><circle cx="419.89658971758547" cy="961.2631024329357" r="11.299773434530296" fill="#FF4500"/><circle cx="126.01693746105025" cy="886.2005218234057" r="5.020202032452015" fill="#FF4500"/><circle cx="881.8593551049303" cy="956.6571274542941" r="13.53357201818497" fill="#FF4500"/><circle cx="305.1479622105422" cy="819.344772087465" r="9.521553343566945" fill="#FF4500"/><circle cx="528.4282060932885" cy="819.5910913478658" r="12.588882017539166" fill="#FF4500"/><circle cx="744.2208054404218" cy="993.2057510649105" r="9.345003185083375" fill="#FF4500"/><circle cx="847.8195362326912" cy="995.8504986490134" r="6.653153850192255" fill="#FF4500"/><circle cx="423.4999732430504" cy="992.5250217634571" r="5.463119065974682" fill="#FF4500"/><circle cx="761.1517610797085" cy="893.6307846427618" r="8.547403887744627" fill="#FF4500"/><circle cx="96.51348472498245" cy="874.5575216636961" r="11.736961697804436" fill="#FF4500"/><circle cx="279.77780041718694" cy="847.1297226598338" r="10.161877870990345" fill="#FF4500"/><circle cx="992.8316742343579" cy="938.4912680173242" r="11.27629049233387" fill="#FF4500"/><circle cx="432.0724609048654" cy="833.4268306357159" r="6.7229540259211245" fill="#FF4500"/><circle cx="527.0639060780373" cy="914.2680697802191" r="13.340322071787563" fill="#FF4500"/><circle cx="598.0148469832159" cy="889.4817171726944" r="10.431091335632978" fill="#FF4500"/><circle cx="469.1869608999706" cy="810.0234746705918" r="14.83133010846357" fill="#FF4500"/><circle cx="732.1699503415997" cy="942.8092470430729" r="14.852252073705493" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #8162
  </text>

  
</svg>