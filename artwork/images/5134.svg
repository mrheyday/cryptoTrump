<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="239.85298819215117" cy="970.0049419478568" r="8.217244489919981" fill="#FF4500"/><circle cx="172.89988346487894" cy="851.1072456332149" r="9.433761701645246" fill="#FF4500"/><circle cx="62.21982882186916" cy="935.5795580799861" r="13.837023673742584" fill="#FF4500"/><circle cx="605.3294142359207" cy="803.8308020841066" r="13.554449952501308" fill="#FF4500"/><circle cx="655.9538273328351" cy="876.2761381167179" r="11.070239110062335" fill="#FF4500"/><circle cx="646.6593298597123" cy="851.2893080045525" r="12.69922479425732" fill="#FF4500"/><circle cx="313.770195038426" cy="971.2520672449383" r="14.097047580825281" fill="#FF4500"/><circle cx="521.213207976266" cy="881.4127688969894" r="11.155460547615165" fill="#FF4500"/><circle cx="675.1908839352059" cy="873.1556278590119" r="13.201823082970543" fill="#FF4500"/><circle cx="191.54206041268628" cy="888.0684748545355" r="7.72709725245112" fill="#FF4500"/><circle cx="803.7347827703376" cy="944.779686746531" r="7.6085779520657315" fill="#FF4500"/><circle cx="590.1776046901476" cy="898.349610733992" r="5.404781249051287" fill="#FF4500"/><circle cx="125.88973738094379" cy="963.7760158411818" r="14.75520249390865" fill="#FF4500"/><circle cx="386.4347585683365" cy="879.3098687030107" r="5.642728697904347" fill="#FF4500"/><circle cx="882.870364956247" cy="920.0242381390451" r="7.510256488436244" fill="#FF4500"/><circle cx="928.9662594927262" cy="810.3528172547892" r="7.787837200766892" fill="#FF4500"/><circle cx="926.1714634340047" cy="993.0074540240521" r="7.560948513767394" fill="#FF4500"/><circle cx="669.6016218637116" cy="902.9188969494245" r="12.482988129929955" fill="#FF4500"/><circle cx="933.105847426165" cy="873.7239613363074" r="13.507867560532041" fill="#FF4500"/><circle cx="364.0026027577683" cy="883.6765512798776" r="13.93254062815124" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5134
  </text>

  
</svg>