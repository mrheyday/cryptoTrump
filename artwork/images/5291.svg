<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Ethereum Logo --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="110.54110768072611" cy="804.2920091714154" r="12.713769840583014" fill="#FF4500"/><circle cx="736.346425241682" cy="996.0997465037715" r="5.518738582031428" fill="#FF4500"/><circle cx="994.185303926528" cy="977.4318949180903" r="6.555893149728926" fill="#FF4500"/><circle cx="780.0439580010321" cy="837.1643021665618" r="9.098109599283413" fill="#FF4500"/><circle cx="602.6848716693145" cy="942.289644899508" r="11.003899919529124" fill="#FF4500"/><circle cx="522.8305262098683" cy="915.9144766824359" r="10.432178254290651" fill="#FF4500"/><circle cx="709.5351615373527" cy="920.218030301246" r="6.634151909658367" fill="#FF4500"/><circle cx="658.8010673520968" cy="871.1577142028675" r="14.645343994045168" fill="#FF4500"/><circle cx="699.3695353330285" cy="818.9434377349589" r="14.813565835128877" fill="#FF4500"/><circle cx="837.5349988092308" cy="805.9143106222223" r="6.887147567663677" fill="#FF4500"/><circle cx="816.2138577634132" cy="953.597692041666" r="7.418447539667163" fill="#FF4500"/><circle cx="395.60537216850065" cy="999.8674071842464" r="6.812360636110406" fill="#FF4500"/><circle cx="945.4898667855125" cy="915.4505565443682" r="13.30883537663235" fill="#FF4500"/><circle cx="741.1394143544892" cy="818.0882571412508" r="14.847222163615243" fill="#FF4500"/><circle cx="870.7781779327036" cy="873.4614250229575" r="10.600116179842644" fill="#FF4500"/><circle cx="575.9263922431963" cy="989.1135199125465" r="7.569347467626217" fill="#FF4500"/><circle cx="699.1146797376641" cy="958.805542483713" r="9.53101987829617" fill="#FF4500"/><circle cx="296.89407873507736" cy="869.7318649612937" r="12.693641401319413" fill="#FF4500"/><circle cx="370.9122225398289" cy="802.3008965831395" r="14.158807143347323" fill="#FF4500"/><circle cx="121.49060163059589" cy="889.3955356443048" r="14.696051379153182" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5291
  </text>

  
</svg>