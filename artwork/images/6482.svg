<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="321.85709999917367" cy="824.9039085625363" r="11.722294233862097" fill="#FF4500"/><circle cx="804.1270383749127" cy="876.012063075879" r="7.889150504950589" fill="#FF4500"/><circle cx="249.88566745538532" cy="802.9281487403098" r="11.892808022909502" fill="#FF4500"/><circle cx="368.94679920692306" cy="951.5278622461346" r="5.40964772001753" fill="#FF4500"/><circle cx="104.50687199612973" cy="978.3472289289496" r="12.499106817667604" fill="#FF4500"/><circle cx="683.853273913623" cy="916.6728382684429" r="8.005529089292423" fill="#FF4500"/><circle cx="620.9554340154118" cy="950.5542772538994" r="12.151100741131437" fill="#FF4500"/><circle cx="633.7237555432554" cy="894.8394399420893" r="14.912278472360377" fill="#FF4500"/><circle cx="70.58243886346682" cy="898.8001005396849" r="5.323436986063457" fill="#FF4500"/><circle cx="315.0974332329406" cy="908.8447291169434" r="9.094109892771584" fill="#FF4500"/><circle cx="264.793440545676" cy="841.2337571156165" r="14.64294492349394" fill="#FF4500"/><circle cx="430.82992158864863" cy="948.0779682390253" r="11.111660824579308" fill="#FF4500"/><circle cx="583.513891036854" cy="871.0519630367372" r="7.567227416804427" fill="#FF4500"/><circle cx="876.0042213626205" cy="993.6868032507371" r="5.667723385903152" fill="#FF4500"/><circle cx="741.2795595723438" cy="923.3514354739223" r="8.758994042342632" fill="#FF4500"/><circle cx="344.765824448255" cy="944.7751165569896" r="14.664379254008036" fill="#FF4500"/><circle cx="784.5552531083159" cy="995.990723877468" r="11.045547813698818" fill="#FF4500"/><circle cx="280.887403573199" cy="847.1987457270611" r="6.568705646009205" fill="#FF4500"/><circle cx="829.4725715630078" cy="868.2117621644074" r="9.812186992950735" fill="#FF4500"/><circle cx="513.918317885724" cy="865.7747429389666" r="9.97030537291214" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #6482
  </text>

  
</svg>