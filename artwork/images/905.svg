<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFFFFF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9d9d9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9d9d9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,430 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="842.2597906455229" cy="949.7105263995703" r="5.730244542673713" fill="#FF4500"/><circle cx="451.3842022909311" cy="967.218964473498" r="13.314864107601137" fill="#FF4500"/><circle cx="680.6360870099264" cy="974.1548214141654" r="5.848752979963814" fill="#FF4500"/><circle cx="517.8929195866053" cy="883.8350290787348" r="6.092605646060269" fill="#FF4500"/><circle cx="300.4252629482111" cy="965.8391597994254" r="12.812505584757012" fill="#FF4500"/><circle cx="806.4599250456159" cy="828.8920673132343" r="13.291862910646934" fill="#FF4500"/><circle cx="53.58457703294772" cy="802.160879523687" r="12.657507902551" fill="#FF4500"/><circle cx="126.48082958687267" cy="896.0650353342648" r="8.94487460910193" fill="#FF4500"/><circle cx="119.38678152603299" cy="855.2915629613577" r="9.690431206132079" fill="#FF4500"/><circle cx="738.0625595559443" cy="879.6792180392748" r="5.9613254593417775" fill="#FF4500"/><circle cx="414.27742343653296" cy="998.5691916871245" r="14.865152348479281" fill="#FF4500"/><circle cx="977.92148916407" cy="800.8907087112881" r="13.324520371945718" fill="#FF4500"/><circle cx="711.8209144068908" cy="924.9631878751314" r="14.15451435573404" fill="#FF4500"/><circle cx="121.46229544205944" cy="804.9215543141743" r="14.254305410470229" fill="#FF4500"/><circle cx="650.5096796273475" cy="837.8345841553918" r="6.910804929193715" fill="#FF4500"/><circle cx="124.21236965182759" cy="932.4805862000828" r="12.186368696130929" fill="#FF4500"/><circle cx="486.4358441321373" cy="963.8534809246229" r="6.9156412956547335" fill="#FF4500"/><circle cx="932.9649142908014" cy="981.0410075266113" r="11.742959441842341" fill="#FF4500"/><circle cx="363.26836428940123" cy="847.3440599599668" r="14.736506225745991" fill="#FF4500"/><circle cx="307.0494480156285" cy="932.5342683585176" r="8.259963149713753" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #905
  </text>

  
</svg>