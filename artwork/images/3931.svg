<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#355E3B"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFFFFF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9d9d9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9d9d9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="377.01578002178104" cy="898.0966788772685" r="10.268067588168218" fill="#FF4500"/><circle cx="375.0268689811971" cy="822.12619730824" r="6.704274006425697" fill="#FF4500"/><circle cx="739.9760140782374" cy="899.8263462289851" r="7.842054914623883" fill="#FF4500"/><circle cx="871.6647736080143" cy="971.7819523084779" r="6.715909023006182" fill="#FF4500"/><circle cx="653.4136127248073" cy="998.3129368615045" r="7.758307326335599" fill="#FF4500"/><circle cx="47.95793115565061" cy="947.6553192499464" r="5.944679190463205" fill="#FF4500"/><circle cx="275.4914898722736" cy="963.3271351131822" r="5.56179094171271" fill="#FF4500"/><circle cx="401.5741675915969" cy="822.4991191531087" r="10.020442034498792" fill="#FF4500"/><circle cx="380.18775121105983" cy="988.0930439642283" r="13.47571934842744" fill="#FF4500"/><circle cx="0.12836969074769833" cy="841.35486894423" r="7.773508485855498" fill="#FF4500"/><circle cx="496.18768090795663" cy="875.6557785733752" r="13.013667077922602" fill="#FF4500"/><circle cx="25.91208586322957" cy="873.5327144717817" r="11.91120754781834" fill="#FF4500"/><circle cx="663.77362277239" cy="987.432312119026" r="12.417129297310051" fill="#FF4500"/><circle cx="334.7367012317137" cy="971.2835121375771" r="11.735261516233875" fill="#FF4500"/><circle cx="723.9293092840045" cy="812.5626330423406" r="13.409543642500662" fill="#FF4500"/><circle cx="124.56204334899357" cy="804.9092008627732" r="5.633103802710964" fill="#FF4500"/><circle cx="357.6508397476641" cy="820.9998444985188" r="8.001308377220415" fill="#FF4500"/><circle cx="794.2700845278987" cy="981.0606569290486" r="12.973613885493084" fill="#FF4500"/><circle cx="754.5871832646826" cy="939.1896425844376" r="11.402393798853907" fill="#FF4500"/><circle cx="28.193343909536985" cy="909.985474506288" r="5.096017673879524" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #3931
  </text>

  
</svg>