<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a6a6a6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#8d8d8d" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#8d8d8d" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- NFT Badge --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="907.5853769686427" cy="830.8789551026231" r="14.910495046558893" fill="#FF4500"/><circle cx="894.3051999626963" cy="871.9439094256303" r="9.967764877744196" fill="#FF4500"/><circle cx="911.041761747946" cy="842.9203421717352" r="9.817249008475974" fill="#FF4500"/><circle cx="947.378427188054" cy="921.6514127692091" r="9.280900933538575" fill="#FF4500"/><circle cx="824.5128219956357" cy="880.5866444144905" r="14.755152102759677" fill="#FF4500"/><circle cx="572.427386375539" cy="993.1407358532539" r="11.20467784166138" fill="#FF4500"/><circle cx="1.6659006873338544" cy="984.9927770388471" r="14.537020807572695" fill="#FF4500"/><circle cx="796.9052992153762" cy="867.0225722648943" r="8.020115100796662" fill="#FF4500"/><circle cx="582.4798878670534" cy="841.893957352439" r="7.325788014408197" fill="#FF4500"/><circle cx="206.75513382576293" cy="871.843751200655" r="13.69724667750831" fill="#FF4500"/><circle cx="892.1073222543581" cy="870.7990259252515" r="9.014797395920402" fill="#FF4500"/><circle cx="364.3996263542242" cy="965.9100517468027" r="5.7908372712924905" fill="#FF4500"/><circle cx="174.64543281268897" cy="983.9294630937176" r="7.209388020764919" fill="#FF4500"/><circle cx="433.7542369396405" cy="973.7914452293443" r="5.2960065430181436" fill="#FF4500"/><circle cx="77.41596820135821" cy="970.0192881622588" r="5.143190191360453" fill="#FF4500"/><circle cx="508.87760449583453" cy="970.1922022007926" r="9.068364856149994" fill="#FF4500"/><circle cx="975.5369088341768" cy="999.4429691533112" r="6.873905467562151" fill="#FF4500"/><circle cx="788.4498716332112" cy="851.2995637511922" r="9.302158475100741" fill="#FF4500"/><circle cx="382.727109620701" cy="984.9776241105125" r="10.607724177208535" fill="#FF4500"/><circle cx="771.6550050521322" cy="882.5598511528287" r="12.205284739270827" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #1546
  </text>

  
</svg>