<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <line x1="460" y1="410" x2="540" y2="410" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Twitter Bird --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="508.07818260484925" cy="867.9557358646116" r="8.57192330247554" fill="#FF4500"/><circle cx="453.803244208284" cy="873.1735336554503" r="13.70319012886036" fill="#FF4500"/><circle cx="375.567568812196" cy="884.1378649093215" r="5.328483562921313" fill="#FF4500"/><circle cx="286.0468426353582" cy="996.7997486432375" r="7.478004034147383" fill="#FF4500"/><circle cx="560.9322436760968" cy="994.220788071296" r="6.621628559646469" fill="#FF4500"/><circle cx="773.2666633435236" cy="920.3487983427727" r="9.818146058109207" fill="#FF4500"/><circle cx="58.29704564651039" cy="879.0013090400428" r="11.0556066736555" fill="#FF4500"/><circle cx="875.6618359138942" cy="934.7983322716855" r="7.601472073134785" fill="#FF4500"/><circle cx="899.9190291166792" cy="922.1369080877" r="6.907676109646981" fill="#FF4500"/><circle cx="379.98988583266555" cy="942.4350000685309" r="9.358165596938386" fill="#FF4500"/><circle cx="758.0561508378767" cy="943.4176230850817" r="10.025637200076233" fill="#FF4500"/><circle cx="404.5232158575569" cy="975.3080851639749" r="6.887225249192581" fill="#FF4500"/><circle cx="58.84493927343315" cy="843.9554459426823" r="6.515418209161085" fill="#FF4500"/><circle cx="114.27223506209839" cy="869.5994230561314" r="10.953878330807603" fill="#FF4500"/><circle cx="753.3557407315063" cy="968.3204546351345" r="12.300502446956727" fill="#FF4500"/><circle cx="715.1643212366214" cy="974.3608909539114" r="7.744649432269195" fill="#FF4500"/><circle cx="295.8566160801366" cy="920.3170202670353" r="9.869184880033192" fill="#FF4500"/><circle cx="774.9812450439568" cy="916.9333978961647" r="5.406155168674993" fill="#FF4500"/><circle cx="727.265221111745" cy="923.8885923144192" r="6.183265173038572" fill="#FF4500"/><circle cx="817.6856853341184" cy="941.2330981221567" r="13.065247927211335" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5246
  </text>

  
</svg>