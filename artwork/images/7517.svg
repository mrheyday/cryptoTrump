<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#355E3B"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="136.68246295702536" cy="959.6254615576363" r="11.419200548055331" fill="#FF4500"/><circle cx="71.08611138353949" cy="940.8215047931028" r="5.6426766980232435" fill="#FF4500"/><circle cx="837.5896874934595" cy="969.8389321082439" r="5.210479449387382" fill="#FF4500"/><circle cx="215.73838474929485" cy="849.2557420109345" r="8.93710443289929" fill="#FF4500"/><circle cx="221.19743963755644" cy="936.7276418403318" r="12.113977513571301" fill="#FF4500"/><circle cx="489.5811806027111" cy="833.6364239710846" r="11.840456755508049" fill="#FF4500"/><circle cx="845.8390996807925" cy="804.6049463045141" r="11.943865508376634" fill="#FF4500"/><circle cx="786.633075550874" cy="854.8058329635328" r="11.788291770471295" fill="#FF4500"/><circle cx="128.0836112939201" cy="916.7973541239113" r="13.227885477674718" fill="#FF4500"/><circle cx="543.9294818265292" cy="995.8230170638999" r="9.389302722333642" fill="#FF4500"/><circle cx="751.1045584930449" cy="994.0832205555811" r="8.677324773625006" fill="#FF4500"/><circle cx="579.3791776002665" cy="929.3263778062417" r="9.055283861029501" fill="#FF4500"/><circle cx="145.28692913785713" cy="901.3086977697748" r="11.620806390940004" fill="#FF4500"/><circle cx="110.41185792180164" cy="944.5746910014477" r="11.063301272414401" fill="#FF4500"/><circle cx="719.4118974198204" cy="830.8402303994525" r="11.402618602244761" fill="#FF4500"/><circle cx="603.5361149972414" cy="852.8866167036912" r="14.193269971699046" fill="#FF4500"/><circle cx="97.25395587628127" cy="808.2181208971423" r="5.025654943727014" fill="#FF4500"/><circle cx="58.8176226554451" cy="976.7284137723666" r="8.14835579305624" fill="#FF4500"/><circle cx="248.19272144141968" cy="848.9847736098416" r="8.814609792938754" fill="#FF4500"/><circle cx="221.28374516179306" cy="870.8709481840551" r="9.590483794080722" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #7517
  </text>

  
</svg>