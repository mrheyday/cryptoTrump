<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cca400;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d9b100" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <rect x="410" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <rect x="520" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <line x1="480" y1="330" x2="520" y2="330" stroke="#000000" stroke-width="3"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="221.1727235031513" cy="805.7066632693763" r="6.901109146560254" fill="#FF4500"/><circle cx="575.6651588158035" cy="907.4098149814928" r="13.110314804408299" fill="#FF4500"/><circle cx="26.622742321380734" cy="875.5425611506565" r="10.19858373583169" fill="#FF4500"/><circle cx="976.7089934663484" cy="948.8401354869806" r="8.576741073726723" fill="#FF4500"/><circle cx="301.47413525618873" cy="974.1153665250688" r="12.783779703594973" fill="#FF4500"/><circle cx="306.0664721852746" cy="904.2083275021022" r="6.714058067409989" fill="#FF4500"/><circle cx="562.5153488898243" cy="889.7223183158218" r="10.418600549775366" fill="#FF4500"/><circle cx="70.82522925523804" cy="881.6857561557423" r="9.505094243295055" fill="#FF4500"/><circle cx="984.1947703714719" cy="854.105157952944" r="5.339240179855285" fill="#FF4500"/><circle cx="782.1599813943793" cy="855.7490713716662" r="7.7494695363078865" fill="#FF4500"/><circle cx="341.39796050189887" cy="958.5752453650687" r="6.423179237409091" fill="#FF4500"/><circle cx="555.7640340091954" cy="908.547332961781" r="7.044042121161782" fill="#FF4500"/><circle cx="964.4826313971599" cy="828.2828068856651" r="9.816856786706673" fill="#FF4500"/><circle cx="567.0233004123775" cy="800.9891729001141" r="9.180829546328773" fill="#FF4500"/><circle cx="986.4838952871085" cy="960.0329459347528" r="10.228506673515717" fill="#FF4500"/><circle cx="674.8494031841723" cy="824.7374108710637" r="5.290921087841358" fill="#FF4500"/><circle cx="317.67603311138237" cy="807.8853931475951" r="5.129570550823175" fill="#FF4500"/><circle cx="937.8086359601763" cy="884.2447184550734" r="10.451202316658561" fill="#FF4500"/><circle cx="28.47219674678181" cy="941.1235385014407" r="6.1871091391122235" fill="#FF4500"/><circle cx="109.31018682571758" cy="986.2772922931116" r="7.242809771580019" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #1932
  </text>

  
</svg>