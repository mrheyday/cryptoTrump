<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="28.70663317208555" cy="883.7056068225742" r="5.092954122873108" fill="#FF4500"/><circle cx="132.02365835321794" cy="979.4845527096359" r="13.179544112274828" fill="#FF4500"/><circle cx="816.8015602249752" cy="877.3909661409181" r="9.888999689169802" fill="#FF4500"/><circle cx="224.0772063476306" cy="975.4271184087951" r="11.636598779816369" fill="#FF4500"/><circle cx="307.23845596163255" cy="967.8854511725025" r="14.102513262667928" fill="#FF4500"/><circle cx="721.3533486784361" cy="816.7488639114873" r="7.513185825435224" fill="#FF4500"/><circle cx="647.0347715032161" cy="872.9362421355142" r="11.384207775988276" fill="#FF4500"/><circle cx="324.7399716235837" cy="875.0577822673974" r="13.276726152635376" fill="#FF4500"/><circle cx="305.0248632670276" cy="974.9067844901167" r="6.613711450613591" fill="#FF4500"/><circle cx="66.3763404283726" cy="947.1719151190931" r="11.354484491969892" fill="#FF4500"/><circle cx="57.03460409798189" cy="922.6095960262885" r="5.412135604316742" fill="#FF4500"/><circle cx="731.5383938941707" cy="843.1408769403315" r="12.02249497304643" fill="#FF4500"/><circle cx="33.20460929741542" cy="999.6103589213935" r="6.723990007124094" fill="#FF4500"/><circle cx="830.5057322993794" cy="819.8986025317749" r="8.642179291471013" fill="#FF4500"/><circle cx="404.234512129666" cy="899.6480053095167" r="12.91515967648644" fill="#FF4500"/><circle cx="317.5197968289627" cy="844.4907578737099" r="5.655861527479016" fill="#FF4500"/><circle cx="336.54397813519176" cy="931.9493753868169" r="14.46602100233408" fill="#FF4500"/><circle cx="378.2331671644017" cy="859.3259060205136" r="14.757675142181611" fill="#FF4500"/><circle cx="543.454978040325" cy="947.97081497493" r="10.326215335493865" fill="#FF4500"/><circle cx="640.2839911912497" cy="832.0534708644483" r="14.102699291367504" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #125
  </text>

  
</svg>