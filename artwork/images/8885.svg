<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#003366"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,430 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="810.3041952593246" cy="825.8119373953353" r="10.696385504383322" fill="#FF4500"/><circle cx="954.522220180607" cy="898.9288116952717" r="9.32440293808683" fill="#FF4500"/><circle cx="809.4159517768014" cy="945.8008553024637" r="7.554868213151964" fill="#FF4500"/><circle cx="213.12906719650604" cy="868.2358057003687" r="12.038626866847913" fill="#FF4500"/><circle cx="671.5771814130056" cy="954.0412153059453" r="11.90866128489574" fill="#FF4500"/><circle cx="322.02957221237625" cy="948.9009704658004" r="9.369680270420812" fill="#FF4500"/><circle cx="637.4673310276355" cy="933.2143402134185" r="10.058694443679311" fill="#FF4500"/><circle cx="455.7945282765754" cy="918.6619373784281" r="14.061076619046686" fill="#FF4500"/><circle cx="350.6139322050974" cy="980.3287350475329" r="5.150631979181104" fill="#FF4500"/><circle cx="829.4936188894095" cy="838.2577873281593" r="14.144021204125309" fill="#FF4500"/><circle cx="188.03752455796484" cy="883.0159828502414" r="12.751824129015901" fill="#FF4500"/><circle cx="549.063548096997" cy="942.6151987577098" r="9.527587546529775" fill="#FF4500"/><circle cx="399.62641748174474" cy="937.9482661581226" r="12.62496222774767" fill="#FF4500"/><circle cx="638.953827230261" cy="923.8905905006704" r="11.465577369042276" fill="#FF4500"/><circle cx="67.41271432623263" cy="924.6190588245744" r="8.411868989443915" fill="#FF4500"/><circle cx="73.25722551503699" cy="914.2070971166411" r="5.19994315716797" fill="#FF4500"/><circle cx="129.64311707532028" cy="960.7256630044811" r="5.721790795496206" fill="#FF4500"/><circle cx="893.2974149243629" cy="970.8725849310425" r="13.506879918887462" fill="#FF4500"/><circle cx="693.3575039462769" cy="854.300836959795" r="14.598029845891702" fill="#FF4500"/><circle cx="857.6889728914285" cy="997.7798896887866" r="6.265596119349377" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #8885
  </text>

  
</svg>