<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="991.5993348505501" cy="974.6129232840942" r="6.825425564836063" fill="#FF4500"/><circle cx="213.45474961198806" cy="952.9931988374758" r="5.155006691203949" fill="#FF4500"/><circle cx="594.0959042825325" cy="830.0094304170698" r="6.809305473316263" fill="#FF4500"/><circle cx="838.4750044820346" cy="961.1937573778941" r="12.925594066893211" fill="#FF4500"/><circle cx="373.3015828072941" cy="956.1771708183942" r="9.972266074280604" fill="#FF4500"/><circle cx="5.9258075663870535" cy="891.179300330978" r="6.214044791888613" fill="#FF4500"/><circle cx="776.4559692740655" cy="930.7137049918815" r="10.525240987046597" fill="#FF4500"/><circle cx="865.1045601192728" cy="825.6689653609483" r="12.473656819219016" fill="#FF4500"/><circle cx="862.7909108335887" cy="953.383222952895" r="8.964399704888953" fill="#FF4500"/><circle cx="584.9346869656338" cy="961.70707328675" r="7.64103639466253" fill="#FF4500"/><circle cx="467.4621844682967" cy="905.0041364797077" r="13.603219772006426" fill="#FF4500"/><circle cx="409.93199373621" cy="982.8662483831138" r="10.141352408123627" fill="#FF4500"/><circle cx="245.71045142980762" cy="806.4945151247193" r="14.211020630395772" fill="#FF4500"/><circle cx="364.01489438618984" cy="946.8654406263479" r="5.046759955608582" fill="#FF4500"/><circle cx="670.968166999732" cy="844.5331472867701" r="14.794344415566947" fill="#FF4500"/><circle cx="785.939450113986" cy="833.8296674898445" r="7.485823790247292" fill="#FF4500"/><circle cx="982.155092292204" cy="931.9815021133037" r="12.904237984469793" fill="#FF4500"/><circle cx="551.6904669105098" cy="986.8350424122016" r="14.817826034052835" fill="#FF4500"/><circle cx="343.8634516367427" cy="818.7689001988779" r="9.217264447520215" fill="#FF4500"/><circle cx="175.83246577953892" cy="854.0073875178217" r="13.443946018668802" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #25
  </text>

  
</svg>