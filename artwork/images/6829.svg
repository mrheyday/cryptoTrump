<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="712.7144283672155" cy="857.7430261860711" r="8.901526199255926" fill="#FF4500"/><circle cx="244.08840180547077" cy="848.3868211925527" r="10.682260306115566" fill="#FF4500"/><circle cx="483.85788906657103" cy="824.681090306814" r="7.6097391241999945" fill="#FF4500"/><circle cx="300.75406206339903" cy="817.2143005045077" r="14.808196267689201" fill="#FF4500"/><circle cx="34.79505797727733" cy="867.3241054472104" r="8.827234212095739" fill="#FF4500"/><circle cx="831.0663834740026" cy="972.9871847051182" r="9.651871329509817" fill="#FF4500"/><circle cx="906.6849637777461" cy="819.7815543361838" r="11.489473174153042" fill="#FF4500"/><circle cx="759.0492381091194" cy="869.8462066325677" r="10.789488484079552" fill="#FF4500"/><circle cx="920.1241550625712" cy="829.8595273404729" r="7.818562362467894" fill="#FF4500"/><circle cx="138.5662195266393" cy="979.6228303298722" r="7.45479110503817" fill="#FF4500"/><circle cx="441.2407075137435" cy="956.8540937177355" r="14.216411915834108" fill="#FF4500"/><circle cx="566.535389870704" cy="821.2232203988754" r="11.028288526270178" fill="#FF4500"/><circle cx="168.3040063702006" cy="851.2241587823102" r="14.819729840855372" fill="#FF4500"/><circle cx="969.5033716220039" cy="970.3578674573116" r="8.807964011717546" fill="#FF4500"/><circle cx="289.32345593743094" cy="906.6969547393988" r="12.765828351015212" fill="#FF4500"/><circle cx="121.70295904597661" cy="941.0471406764863" r="6.758813230933665" fill="#FF4500"/><circle cx="424.81756708691563" cy="834.7312075736437" r="13.388667600015115" fill="#FF4500"/><circle cx="562.6161793245532" cy="823.7196289833097" r="14.73641459314831" fill="#FF4500"/><circle cx="175.94077713400557" cy="942.86716902433" r="10.592356822473796" fill="#FF4500"/><circle cx="99.3740407205368" cy="987.7411222164648" r="14.337748260217616" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #6829
  </text>

  
</svg>