<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFFFFF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9d9d9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9d9d9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="197.03668793938766" cy="912.1412036868338" r="14.677662503578075" fill="#FF4500"/><circle cx="548.3256632383346" cy="988.0838523968034" r="14.349893835688736" fill="#FF4500"/><circle cx="504.9826360139118" cy="900.564597420741" r="14.430387091906018" fill="#FF4500"/><circle cx="484.9337274369598" cy="974.827440319251" r="13.634597664195931" fill="#FF4500"/><circle cx="636.7556295320774" cy="966.1036411843068" r="11.886602901741721" fill="#FF4500"/><circle cx="608.7524895417245" cy="923.8205363881789" r="6.8971822167152785" fill="#FF4500"/><circle cx="465.3318105501383" cy="977.1312390646433" r="9.17278170834534" fill="#FF4500"/><circle cx="138.50585598670605" cy="815.0227631082726" r="12.706669620133656" fill="#FF4500"/><circle cx="706.6932457509307" cy="962.4810634509298" r="10.24270416632545" fill="#FF4500"/><circle cx="638.0390028471053" cy="849.7917915562604" r="11.13668202444086" fill="#FF4500"/><circle cx="151.04526093576197" cy="953.4554839016581" r="10.415428390766712" fill="#FF4500"/><circle cx="297.1469150519497" cy="904.9293101750708" r="12.095612883654729" fill="#FF4500"/><circle cx="996.5704917164276" cy="898.2959560508937" r="14.621676855640427" fill="#FF4500"/><circle cx="508.49520709466424" cy="827.3843608277592" r="8.973520078707192" fill="#FF4500"/><circle cx="829.7898085569049" cy="969.9433662297745" r="6.134446780763707" fill="#FF4500"/><circle cx="102.53621698493754" cy="997.9882950289436" r="8.289693950714003" fill="#FF4500"/><circle cx="223.88058153674018" cy="900.0406486368051" r="5.95554872803355" fill="#FF4500"/><circle cx="216.33533430046703" cy="827.5224935427296" r="12.594028905966962" fill="#FF4500"/><circle cx="833.5644955680212" cy="873.7187215419636" r="12.198371647403345" fill="#FF4500"/><circle cx="914.5500603974155" cy="865.8622747364084" r="9.04999869882876" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9980
  </text>

  
</svg>