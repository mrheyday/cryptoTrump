<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FFD700"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="795.4637309956482" cy="896.984416990659" r="8.391523504054952" fill="#FF4500"/><circle cx="158.4140050748468" cy="853.4217650297714" r="7.496836990905857" fill="#FF4500"/><circle cx="735.3146338288252" cy="979.3957805693824" r="12.96946217493276" fill="#FF4500"/><circle cx="587.8029168253993" cy="931.2562929920329" r="13.549287446572611" fill="#FF4500"/><circle cx="932.0240485104299" cy="948.7335333733995" r="8.330905410746416" fill="#FF4500"/><circle cx="787.1714669155299" cy="929.4643694039542" r="14.894934215157399" fill="#FF4500"/><circle cx="71.49454452753545" cy="892.4478673693117" r="7.349478787548323" fill="#FF4500"/><circle cx="44.61464234306467" cy="929.4725554965634" r="8.863963129829617" fill="#FF4500"/><circle cx="812.3844821616408" cy="861.1667606375632" r="11.350916460395366" fill="#FF4500"/><circle cx="951.8430086505984" cy="863.2449151753788" r="12.343250398344844" fill="#FF4500"/><circle cx="112.22792058410703" cy="871.5196129682589" r="12.501069869791952" fill="#FF4500"/><circle cx="579.6956941879549" cy="903.3931449252501" r="5.393353578972119" fill="#FF4500"/><circle cx="912.2988694390448" cy="845.6268513556931" r="14.242877123074111" fill="#FF4500"/><circle cx="126.35832133943836" cy="926.6255481939268" r="11.557062689356634" fill="#FF4500"/><circle cx="682.2289622250041" cy="894.1271171909725" r="7.491641151351526" fill="#FF4500"/><circle cx="258.1003878146142" cy="935.5138496200973" r="8.12789708628738" fill="#FF4500"/><circle cx="973.833320584251" cy="998.9963374946758" r="9.890735769701255" fill="#FF4500"/><circle cx="55.9373433549879" cy="827.5219038450316" r="8.103545447365546" fill="#FF4500"/><circle cx="912.4286743506171" cy="856.0989112744768" r="6.944272966952307" fill="#FF4500"/><circle cx="28.738326712066442" cy="851.4383427135989" r="5.046591424666211" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #2369
  </text>

  
</svg>