<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cca400;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d9b100" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- American Flag Pin --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="260.41600272374944" cy="943.9691325084146" r="11.227520231586963" fill="#FF4500"/><circle cx="995.2755151872515" cy="873.5587417618375" r="14.920798106668027" fill="#FF4500"/><circle cx="876.0183734742069" cy="946.008759448182" r="5.016770813742921" fill="#FF4500"/><circle cx="910.5357734639243" cy="947.502287265092" r="8.253713815382822" fill="#FF4500"/><circle cx="373.46843624676796" cy="868.7919934156266" r="9.858257194117844" fill="#FF4500"/><circle cx="621.8970141379081" cy="964.5293759135633" r="6.607237586118728" fill="#FF4500"/><circle cx="141.98662345561354" cy="811.7938997590212" r="12.385871902406864" fill="#FF4500"/><circle cx="206.6780892704332" cy="988.8936154734355" r="8.395340946520113" fill="#FF4500"/><circle cx="551.0475439036497" cy="964.8949631411181" r="5.854339246305631" fill="#FF4500"/><circle cx="943.8664655043534" cy="934.4477244101233" r="7.12978670745577" fill="#FF4500"/><circle cx="309.44456642122486" cy="925.0848257601092" r="5.541334287414539" fill="#FF4500"/><circle cx="455.6312740822728" cy="981.40312594401" r="9.060765526319383" fill="#FF4500"/><circle cx="533.7710346147952" cy="807.6037621978625" r="6.720463423595515" fill="#FF4500"/><circle cx="955.5459240538786" cy="992.2690673321155" r="9.872747071887762" fill="#FF4500"/><circle cx="142.06425148066648" cy="810.5943044123669" r="8.791401046930766" fill="#FF4500"/><circle cx="401.30614757902407" cy="900.9893543030988" r="8.177750452187635" fill="#FF4500"/><circle cx="54.13927242352479" cy="807.4375947008523" r="14.695127027067299" fill="#FF4500"/><circle cx="368.27591808917435" cy="929.4645312940866" r="6.606621952659073" fill="#FF4500"/><circle cx="766.2120719003798" cy="947.3079757338484" r="9.608933863514608" fill="#FF4500"/><circle cx="295.9787236947953" cy="898.767739565097" r="14.80566405372037" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5491
  </text>

  
</svg>