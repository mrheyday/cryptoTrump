<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="239.73222643500947" cy="839.0525314462166" r="8.196786206869982" fill="#FF4500"/><circle cx="46.835968343768684" cy="854.6973016259006" r="9.189781962264082" fill="#FF4500"/><circle cx="256.27762970894753" cy="900.9211938786403" r="9.221007019652387" fill="#FF4500"/><circle cx="568.7221900063865" cy="944.9764076651913" r="11.681497678843114" fill="#FF4500"/><circle cx="770.1333948698252" cy="986.3418937341046" r="12.895652197704715" fill="#FF4500"/><circle cx="93.1297301080658" cy="867.7816282220793" r="13.81570383565862" fill="#FF4500"/><circle cx="568.7626418830516" cy="821.9153981866639" r="9.112914927008095" fill="#FF4500"/><circle cx="884.7202550494337" cy="949.6742743318315" r="12.949011352266096" fill="#FF4500"/><circle cx="94.316551086161" cy="997.7518363174552" r="14.153990673695915" fill="#FF4500"/><circle cx="480.0321545120383" cy="937.6257449961611" r="14.503663510523069" fill="#FF4500"/><circle cx="574.8275740666464" cy="997.4321511437481" r="9.644364000042556" fill="#FF4500"/><circle cx="399.6543976897575" cy="947.0794600349038" r="8.98417741082816" fill="#FF4500"/><circle cx="774.8883814141639" cy="876.8289746682528" r="11.126208040571008" fill="#FF4500"/><circle cx="219.8816804269874" cy="989.7477230516516" r="9.333420226953935" fill="#FF4500"/><circle cx="461.9488817162261" cy="883.9929449543124" r="5.526328008970709" fill="#FF4500"/><circle cx="27.648641771189865" cy="847.9563049073416" r="13.788033898298838" fill="#FF4500"/><circle cx="429.54734692863127" cy="871.4454135380719" r="10.523338635097218" fill="#FF4500"/><circle cx="871.9260650097729" cy="957.5949814097318" r="14.983373986955522" fill="#FF4500"/><circle cx="968.2284882473645" cy="878.6346775399104" r="9.912310919104009" fill="#FF4500"/><circle cx="190.40356117982049" cy="884.2936790178661" r="7.917822516001514" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #1227
  </text>

  
</svg>