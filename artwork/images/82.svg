<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#8C7AE6" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#6654c0" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#6654c0" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="638.9326158258189" cy="916.204327955677" r="9.528925098195199" fill="#FF4500"/><circle cx="680.1281826010677" cy="885.668961728626" r="9.421913984560135" fill="#FF4500"/><circle cx="569.3622169296992" cy="950.8080752546311" r="7.818683269986124" fill="#FF4500"/><circle cx="110.72247220685827" cy="839.7904014791122" r="9.958549928699068" fill="#FF4500"/><circle cx="603.5321654513359" cy="810.0006797104359" r="8.552680254233788" fill="#FF4500"/><circle cx="775.818280578167" cy="835.5024741147245" r="5.643941184655605" fill="#FF4500"/><circle cx="188.7826857396251" cy="866.8887724831181" r="5.603515604863311" fill="#FF4500"/><circle cx="346.0010278523049" cy="852.1317740298729" r="8.126216781410811" fill="#FF4500"/><circle cx="738.8203518379346" cy="948.6176329780816" r="12.075561628547932" fill="#FF4500"/><circle cx="291.06685444593626" cy="995.2067142803858" r="14.471037084380756" fill="#FF4500"/><circle cx="549.5285359108266" cy="811.9954214904541" r="10.6508516363445" fill="#FF4500"/><circle cx="707.7075043350567" cy="942.0364752687132" r="13.788193612838086" fill="#FF4500"/><circle cx="470.245936262345" cy="886.0335102797736" r="8.318422722830558" fill="#FF4500"/><circle cx="513.0586951357079" cy="824.4382568532438" r="14.616381627312762" fill="#FF4500"/><circle cx="823.092432757887" cy="950.1796696920921" r="13.433945451903176" fill="#FF4500"/><circle cx="280.99950391780635" cy="919.3285234952714" r="11.900927499009686" fill="#FF4500"/><circle cx="506.61961285049784" cy="874.0083798428515" r="7.229722858785117" fill="#FF4500"/><circle cx="195.02421176922536" cy="810.3672509767607" r="12.086760356258697" fill="#FF4500"/><circle cx="734.506962751021" cy="949.907272170445" r="12.14709555209182" fill="#FF4500"/><circle cx="675.214332622928" cy="884.516846203627" r="7.770711751170505" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #82
  </text>

  
</svg>