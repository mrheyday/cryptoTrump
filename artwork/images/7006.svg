<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FFD700"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="291.2193488251082" cy="951.863610128572" r="8.171652733026999" fill="#FF4500"/><circle cx="937.3683349031268" cy="880.2784644093147" r="10.354434251129302" fill="#FF4500"/><circle cx="567.7673227431832" cy="911.7709062393172" r="7.29992253399236" fill="#FF4500"/><circle cx="667.8678844899342" cy="972.6346564366435" r="13.54504862448955" fill="#FF4500"/><circle cx="484.96967827897276" cy="984.4697545258701" r="10.231255191278045" fill="#FF4500"/><circle cx="172.43000594211045" cy="850.5362966448013" r="8.901520895693917" fill="#FF4500"/><circle cx="178.3481766925832" cy="906.0247132551733" r="7.9768730412795685" fill="#FF4500"/><circle cx="609.3940327369518" cy="901.2705163638117" r="11.286785913106863" fill="#FF4500"/><circle cx="765.2728693905899" cy="842.1360812116968" r="14.11261186324455" fill="#FF4500"/><circle cx="533.8309611861712" cy="888.6037126681322" r="12.785488075779355" fill="#FF4500"/><circle cx="456.68151844004234" cy="888.2306490707725" r="11.499862703809011" fill="#FF4500"/><circle cx="92.87801324508615" cy="976.5489891493644" r="9.65705573083662" fill="#FF4500"/><circle cx="103.37465409771873" cy="957.54527197237" r="8.366867872252806" fill="#FF4500"/><circle cx="248.65345645499448" cy="810.084328567064" r="8.269612337527178" fill="#FF4500"/><circle cx="226.93522029311075" cy="994.109334225638" r="6.35876074133116" fill="#FF4500"/><circle cx="544.5333338068185" cy="982.1753561966533" r="14.186081246587467" fill="#FF4500"/><circle cx="943.2456551618549" cy="875.5257244211451" r="7.159147678997937" fill="#FF4500"/><circle cx="735.7117031975063" cy="897.9388466386679" r="10.805451471432562" fill="#FF4500"/><circle cx="615.0443010528577" cy="964.7910560494653" r="7.009894266204553" fill="#FF4500"/><circle cx="997.433767280325" cy="996.0359385989059" r="7.610513831334487" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #7006
  </text>

  
</svg>