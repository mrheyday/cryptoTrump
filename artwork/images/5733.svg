<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="282.3055953272662" cy="945.0249196941684" r="6.3186111294401766" fill="#FF4500"/><circle cx="914.9708215339379" cy="893.6712917043934" r="13.38070476736375" fill="#FF4500"/><circle cx="141.47251595140898" cy="892.3853521224142" r="14.621026943289785" fill="#FF4500"/><circle cx="963.5711355946381" cy="980.6775308813203" r="13.048097044802091" fill="#FF4500"/><circle cx="978.6272254799488" cy="851.9838443045395" r="8.20114980454624" fill="#FF4500"/><circle cx="263.91752766822793" cy="895.9424354767017" r="10.904784582243652" fill="#FF4500"/><circle cx="165.28144122258092" cy="934.5006482031868" r="14.724518663344274" fill="#FF4500"/><circle cx="196.44470206945817" cy="939.7631280463793" r="12.740823894166976" fill="#FF4500"/><circle cx="603.1390509292573" cy="927.6455640035617" r="12.12081961656023" fill="#FF4500"/><circle cx="530.3254635455763" cy="917.5818598862998" r="9.570614824699682" fill="#FF4500"/><circle cx="808.8179619253566" cy="845.5122828768717" r="6.8361260261918115" fill="#FF4500"/><circle cx="291.8816357978402" cy="929.4444263016292" r="5.460800059309561" fill="#FF4500"/><circle cx="199.6855002853286" cy="964.1962508666428" r="7.748517210531758" fill="#FF4500"/><circle cx="235.0107839467759" cy="935.420986184736" r="12.06023913919396" fill="#FF4500"/><circle cx="871.6063765847415" cy="929.3880892923734" r="12.334131293522493" fill="#FF4500"/><circle cx="616.5203435645885" cy="820.9024724397549" r="9.44993738553955" fill="#FF4500"/><circle cx="474.7413310058037" cy="841.7517957345007" r="14.162595689008793" fill="#FF4500"/><circle cx="425.8828521842699" cy="942.1646641980539" r="7.6899950386159555" fill="#FF4500"/><circle cx="474.9639589816097" cy="850.4698870543457" r="14.475299363840207" fill="#FF4500"/><circle cx="591.6354116281799" cy="905.3103837558441" r="13.41110375284152" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5733
  </text>

  
</svg>