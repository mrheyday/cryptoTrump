<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#DAA520"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="649.8396140131289" cy="947.57642651061" r="12.836551879810926" fill="#FF4500"/><circle cx="424.30769237512635" cy="840.5154131231152" r="8.819715685462409" fill="#FF4500"/><circle cx="451.6515575600266" cy="962.0523658795104" r="8.11564451460643" fill="#FF4500"/><circle cx="878.4974365063707" cy="944.1159746901557" r="13.168593004534559" fill="#FF4500"/><circle cx="642.7923674271066" cy="974.8588958996198" r="10.946698322008832" fill="#FF4500"/><circle cx="971.2189737254436" cy="862.1439977632442" r="14.165262740356903" fill="#FF4500"/><circle cx="986.2569154623271" cy="808.3495166581336" r="5.021948859294851" fill="#FF4500"/><circle cx="789.343863634409" cy="817.3458543308452" r="10.86483086455221" fill="#FF4500"/><circle cx="102.11997003973883" cy="968.77172775569" r="10.154105118372598" fill="#FF4500"/><circle cx="194.10462199008637" cy="884.5675437239731" r="10.185916603986856" fill="#FF4500"/><circle cx="274.50541466432577" cy="802.6365222264278" r="9.538196096113156" fill="#FF4500"/><circle cx="673.8068037435307" cy="860.1114888334096" r="7.427174008089798" fill="#FF4500"/><circle cx="737.7490037784497" cy="900.0439646601271" r="12.835333401913829" fill="#FF4500"/><circle cx="160.2435849523638" cy="983.4251652794364" r="6.2231148941888055" fill="#FF4500"/><circle cx="376.7194049584663" cy="834.1064055074238" r="6.530053108066092" fill="#FF4500"/><circle cx="813.2559225244585" cy="895.9520948858877" r="11.59716605203172" fill="#FF4500"/><circle cx="805.2094654939394" cy="993.2332256257832" r="9.411764994655494" fill="#FF4500"/><circle cx="300.26342930713025" cy="885.1111487368253" r="5.552090191969608" fill="#FF4500"/><circle cx="996.8733052368368" cy="879.7853133820568" r="10.325391212112194" fill="#FF4500"/><circle cx="945.4485045342278" cy="965.4199043173838" r="12.973703231760139" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #8886
  </text>

  
</svg>