<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#DAA520"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <rect x="410" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <rect x="520" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <line x1="480" y1="330" x2="520" y2="330" stroke="#000000" stroke-width="3"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="114.4337053725224" cy="876.1096607992898" r="12.14396263118102" fill="#FF4500"/><circle cx="895.2691318818395" cy="851.8918292339379" r="5.490477477033449" fill="#FF4500"/><circle cx="924.2452818461917" cy="967.4885562125899" r="13.629385353704574" fill="#FF4500"/><circle cx="394.8773818010951" cy="847.9097251476433" r="7.963993457867664" fill="#FF4500"/><circle cx="322.7242062901763" cy="827.6578003628781" r="13.732806823828671" fill="#FF4500"/><circle cx="572.6433478094299" cy="968.1131744964292" r="8.149688976572325" fill="#FF4500"/><circle cx="757.18254798007" cy="918.2574516313829" r="9.796401056195794" fill="#FF4500"/><circle cx="177.70889358968844" cy="944.3123801667892" r="10.443805313650255" fill="#FF4500"/><circle cx="625.3101136808898" cy="929.9141776757176" r="13.184154220548027" fill="#FF4500"/><circle cx="197.92958843359477" cy="881.4974676327575" r="5.140046656905954" fill="#FF4500"/><circle cx="511.6077767522111" cy="804.7523624701923" r="5.844026126602677" fill="#FF4500"/><circle cx="18.08284633571411" cy="841.2007366797693" r="7.794832626497388" fill="#FF4500"/><circle cx="586.4622718313717" cy="872.1532238607563" r="12.600300270568837" fill="#FF4500"/><circle cx="955.7783108181505" cy="884.321555292569" r="12.60491923465063" fill="#FF4500"/><circle cx="460.5136082282766" cy="987.2167193246555" r="12.957892036066491" fill="#FF4500"/><circle cx="646.978437092977" cy="945.1044760307315" r="14.18927077602272" fill="#FF4500"/><circle cx="226.21948485033207" cy="930.2909005501003" r="7.9257919369690955" fill="#FF4500"/><circle cx="518.3406581305659" cy="866.4054776223015" r="9.446951590473748" fill="#FF4500"/><circle cx="755.4104457180073" cy="919.6709194775433" r="7.5028823671550215" fill="#FF4500"/><circle cx="511.28299727084215" cy="957.1508418618632" r="6.8317933141807075" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #6477
  </text>

  
</svg>