<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#36454F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#101f29" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#101f29" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <rect x="410" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <rect x="520" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <line x1="480" y1="330" x2="520" y2="330" stroke="#000000" stroke-width="3"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="772.8879012084822" cy="941.8914199739094" r="11.069918968012924" fill="#FF4500"/><circle cx="542.4143503643446" cy="833.4552343392432" r="11.101485210316998" fill="#FF4500"/><circle cx="529.8660764142029" cy="998.6433958476571" r="11.002347616913156" fill="#FF4500"/><circle cx="59.290717926309576" cy="863.0238956010344" r="10.51901480737364" fill="#FF4500"/><circle cx="112.33988351774448" cy="878.6735763048185" r="8.50733145270327" fill="#FF4500"/><circle cx="205.21485342225577" cy="900.0110847187091" r="13.777414168128475" fill="#FF4500"/><circle cx="178.54937304731445" cy="981.9646393809463" r="5.320868727694679" fill="#FF4500"/><circle cx="621.1894155226307" cy="873.3853529084616" r="8.6917826834577" fill="#FF4500"/><circle cx="433.12937518032555" cy="856.3114278454552" r="7.013413806002502" fill="#FF4500"/><circle cx="944.1912722941341" cy="862.2243536259064" r="13.672661333872746" fill="#FF4500"/><circle cx="573.0159268394546" cy="836.2286421395033" r="13.501437430724527" fill="#FF4500"/><circle cx="743.7183514262764" cy="871.1529788401292" r="14.766237589297635" fill="#FF4500"/><circle cx="487.9570165694196" cy="825.544515844714" r="14.09292017750655" fill="#FF4500"/><circle cx="647.5299085983648" cy="908.0142206752137" r="7.767049775851003" fill="#FF4500"/><circle cx="921.1020286430431" cy="970.5814234225682" r="11.808664054398388" fill="#FF4500"/><circle cx="413.61413990759235" cy="990.6792927294969" r="13.684155626049384" fill="#FF4500"/><circle cx="785.1830854777276" cy="954.5762019734717" r="6.830119928274332" fill="#FF4500"/><circle cx="788.1110744711475" cy="868.1098148423883" r="11.987885031623913" fill="#FF4500"/><circle cx="997.958051637708" cy="821.1690744855904" r="7.546956961428879" fill="#FF4500"/><circle cx="363.786098062824" cy="974.5759430718591" r="13.341930695577418" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #1429
  </text>

  
</svg>