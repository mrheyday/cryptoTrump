<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E68C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6cc72;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#003366"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#bdb359" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#bdb359" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="867.805125331496" cy="829.7107704808346" r="5.3048610692683145" fill="#FF4500"/><circle cx="317.5972176173751" cy="970.46853422106" r="14.222275729224698" fill="#FF4500"/><circle cx="750.8654640461789" cy="948.9699261735071" r="13.999022726030619" fill="#FF4500"/><circle cx="384.0982640875135" cy="919.0634515534064" r="12.564791163414755" fill="#FF4500"/><circle cx="967.5892971034283" cy="827.9397984821916" r="9.266327948873398" fill="#FF4500"/><circle cx="646.4450454629251" cy="880.539528966608" r="12.471256865357914" fill="#FF4500"/><circle cx="486.0502908826938" cy="807.532233981379" r="7.109789532640782" fill="#FF4500"/><circle cx="218.32906815217856" cy="858.7362359075755" r="8.167264247924532" fill="#FF4500"/><circle cx="594.2131866970382" cy="974.8956463150703" r="11.978353311303717" fill="#FF4500"/><circle cx="181.09485360598265" cy="866.039771632783" r="11.796478223278227" fill="#FF4500"/><circle cx="387.7519843058905" cy="840.8043617864481" r="9.119698712311447" fill="#FF4500"/><circle cx="374.00960784844403" cy="885.5901326314719" r="9.220222988060783" fill="#FF4500"/><circle cx="108.6457845090001" cy="963.2467664010991" r="9.830068719988212" fill="#FF4500"/><circle cx="763.7741077551487" cy="970.854982972917" r="7.989980775234795" fill="#FF4500"/><circle cx="676.4442645623565" cy="876.7606469092087" r="7.407225145262945" fill="#FF4500"/><circle cx="443.64867438396584" cy="994.2203213079484" r="13.257296856393808" fill="#FF4500"/><circle cx="887.0383757503042" cy="998.430080482829" r="5.143318040024045" fill="#FF4500"/><circle cx="992.2863243539874" cy="890.9058460912089" r="7.4536637005428075" fill="#FF4500"/><circle cx="657.1064131782616" cy="824.9076970889275" r="11.25794757190641" fill="#FF4500"/><circle cx="612.0819880660287" cy="979.2457545097303" r="14.006998989309531" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4339
  </text>

  
</svg>