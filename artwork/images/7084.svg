<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,430 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Presidential Seal --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="113.61079316997613" cy="890.9564715414473" r="9.062389574178969" fill="#FF4500"/><circle cx="1.5544798398920978" cy="862.4916114291111" r="8.614376694314792" fill="#FF4500"/><circle cx="122.18152906767266" cy="952.1289469186185" r="13.742328871967679" fill="#FF4500"/><circle cx="704.0312693876476" cy="816.6788934438024" r="9.910897180196557" fill="#FF4500"/><circle cx="33.66024769475406" cy="931.0075717590029" r="11.509083464975514" fill="#FF4500"/><circle cx="920.4037289336409" cy="826.7181023070005" r="14.097711884902512" fill="#FF4500"/><circle cx="536.0163133946634" cy="842.8041539230416" r="6.110219193624049" fill="#FF4500"/><circle cx="277.1107646091222" cy="878.9666711850099" r="13.68340970176167" fill="#FF4500"/><circle cx="822.2193228348174" cy="980.6863050384449" r="9.841734996133411" fill="#FF4500"/><circle cx="682.736969344812" cy="934.7895258756306" r="14.048895957409144" fill="#FF4500"/><circle cx="828.4253332768093" cy="810.7084332039894" r="7.251186519748842" fill="#FF4500"/><circle cx="491.13496687106675" cy="960.5158457007097" r="6.104685456787329" fill="#FF4500"/><circle cx="863.0089695283287" cy="952.9618743237295" r="5.921742875427722" fill="#FF4500"/><circle cx="270.9233085459395" cy="818.7861512212987" r="11.083654431033285" fill="#FF4500"/><circle cx="121.78652146515279" cy="945.99433525568" r="8.469861759109442" fill="#FF4500"/><circle cx="44.0061198159416" cy="834.3712203586635" r="7.606952926112422" fill="#FF4500"/><circle cx="123.78913585642981" cy="864.3512024846085" r="10.314061912279557" fill="#FF4500"/><circle cx="484.7938239985994" cy="883.9364677090912" r="10.572659253308444" fill="#FF4500"/><circle cx="881.6698768975526" cy="949.8160556767874" r="12.959605950401968" fill="#FF4500"/><circle cx="241.21555230587543" cy="990.9774067314611" r="9.923831560881888" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #7084
  </text>

  
</svg>