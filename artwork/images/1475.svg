<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="25.19495831785057" cy="831.0034470274416" r="10.355989147183958" fill="#FF4500"/><circle cx="780.8292613654924" cy="835.4539725553964" r="10.943762722074375" fill="#FF4500"/><circle cx="583.4053605455188" cy="940.3449951522806" r="13.840961732594355" fill="#FF4500"/><circle cx="545.8374199001206" cy="935.9761185844767" r="7.578949445347847" fill="#FF4500"/><circle cx="15.551455342748932" cy="820.873292841741" r="5.74106807027035" fill="#FF4500"/><circle cx="821.7883286130756" cy="861.8200435977099" r="8.803672808599561" fill="#FF4500"/><circle cx="285.3379959898279" cy="895.3634815539909" r="14.02475019881183" fill="#FF4500"/><circle cx="167.75194187024178" cy="979.3602981073468" r="12.822183336348907" fill="#FF4500"/><circle cx="427.7308877425285" cy="864.4266459566561" r="12.823485470258444" fill="#FF4500"/><circle cx="240.42991933619228" cy="988.5879044126922" r="13.4256647743522" fill="#FF4500"/><circle cx="625.9551612149068" cy="895.0284017417812" r="13.08719505286048" fill="#FF4500"/><circle cx="705.1330794758379" cy="907.444237363521" r="5.328523863906232" fill="#FF4500"/><circle cx="878.0319238269649" cy="995.6547754700024" r="11.696021920690416" fill="#FF4500"/><circle cx="354.89868570255067" cy="841.4418165318924" r="12.098993237982963" fill="#FF4500"/><circle cx="245.65175253628402" cy="870.07946548223" r="13.81798085324791" fill="#FF4500"/><circle cx="113.80259451801922" cy="912.3539555177401" r="14.054400375010525" fill="#FF4500"/><circle cx="670.8708090505675" cy="888.8190803833837" r="13.494018300034785" fill="#FF4500"/><circle cx="298.90526631882517" cy="872.6339527462425" r="14.272021068594093" fill="#FF4500"/><circle cx="663.0753166486634" cy="806.6949915561523" r="12.514850640147781" fill="#FF4500"/><circle cx="324.93154896986545" cy="817.4037341994213" r="6.096325696110938" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #1475
  </text>

  
</svg>