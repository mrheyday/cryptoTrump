<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="642.7563948848534" cy="859.0843706940166" r="11.5615173763412" fill="#FF4500"/><circle cx="734.1773101756388" cy="984.6052870394487" r="11.273942034954237" fill="#FF4500"/><circle cx="50.55567615099776" cy="834.4405055486254" r="13.015252436363347" fill="#FF4500"/><circle cx="517.0278076578447" cy="882.1558267124996" r="8.029762948919007" fill="#FF4500"/><circle cx="324.24897344277537" cy="998.4882563929422" r="5.107250587615011" fill="#FF4500"/><circle cx="301.63494423014225" cy="939.5238873658316" r="12.820583323116011" fill="#FF4500"/><circle cx="816.0710733907566" cy="907.5497047477686" r="7.782676077928055" fill="#FF4500"/><circle cx="650.6403200234172" cy="916.0950769869246" r="8.261150859935631" fill="#FF4500"/><circle cx="197.116022201258" cy="900.2968044409562" r="8.559289085506158" fill="#FF4500"/><circle cx="953.8026827739108" cy="859.5726225011616" r="12.621694228418892" fill="#FF4500"/><circle cx="792.2134075432732" cy="833.858183261084" r="14.348666599039614" fill="#FF4500"/><circle cx="103.20355071169618" cy="971.138720047795" r="9.100101396556683" fill="#FF4500"/><circle cx="608.6599639787289" cy="992.8522830824942" r="6.639668620463817" fill="#FF4500"/><circle cx="606.7759671899009" cy="924.7293275821096" r="9.303047159429836" fill="#FF4500"/><circle cx="228.79483778258526" cy="837.6075123062717" r="12.602005264824614" fill="#FF4500"/><circle cx="77.5529288707868" cy="992.1143804379891" r="8.563690497366842" fill="#FF4500"/><circle cx="662.6924241625734" cy="906.9362992878025" r="5.702316534078884" fill="#FF4500"/><circle cx="342.1453467804803" cy="917.6061109543035" r="10.017859631135916" fill="#FF4500"/><circle cx="563.837942354478" cy="934.5200095740088" r="8.310499876856001" fill="#FF4500"/><circle cx="491.91468698307796" cy="827.471877119489" r="7.589235172790896" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #6883
  </text>

  
</svg>