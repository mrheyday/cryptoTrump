<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- American Flag Pin --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="518.0144338044905" cy="922.7972725069125" r="8.585258412740044" fill="#FF4500"/><circle cx="137.93767725006467" cy="899.1960531562981" r="12.954257027774364" fill="#FF4500"/><circle cx="465.92035790809103" cy="818.5793320822194" r="12.828481602947617" fill="#FF4500"/><circle cx="414.6571506166234" cy="805.649915845891" r="7.940990746283266" fill="#FF4500"/><circle cx="167.3303364527916" cy="821.6167563774131" r="13.866199462124136" fill="#FF4500"/><circle cx="986.8569346431128" cy="877.7168390462723" r="11.745301418480235" fill="#FF4500"/><circle cx="660.5579349254575" cy="842.5676632471583" r="11.369505839361356" fill="#FF4500"/><circle cx="538.7431249973296" cy="907.2698030308378" r="10.55533104310258" fill="#FF4500"/><circle cx="854.5351188005445" cy="942.2433587634674" r="9.413845407866022" fill="#FF4500"/><circle cx="754.9428904036588" cy="943.4195762669772" r="10.702583905433208" fill="#FF4500"/><circle cx="38.00795235064336" cy="905.6806593215406" r="9.704294248627214" fill="#FF4500"/><circle cx="447.04657171174665" cy="803.2920373753058" r="9.356191038315853" fill="#FF4500"/><circle cx="421.437024922809" cy="986.8965606546025" r="8.743950300823828" fill="#FF4500"/><circle cx="247.4238203338579" cy="983.287347301976" r="11.891611341261816" fill="#FF4500"/><circle cx="226.4450327213885" cy="974.126251736522" r="9.762876485691748" fill="#FF4500"/><circle cx="362.26201258008905" cy="911.810390121123" r="7.899709224717693" fill="#FF4500"/><circle cx="474.27621655566264" cy="973.777530830853" r="11.693285646098218" fill="#FF4500"/><circle cx="970.686727536534" cy="877.1369741865425" r="7.447156140564277" fill="#FF4500"/><circle cx="910.0011936751021" cy="829.7089085299615" r="9.085791528151967" fill="#FF4500"/><circle cx="880.9078116376883" cy="816.1141065631591" r="8.997947482937569" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4509
  </text>

  
</svg>