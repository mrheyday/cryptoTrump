<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFFFFF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9d9d9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9d9d9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="805.089885824422" cy="935.5367083061212" r="13.054964927364436" fill="#FF4500"/><circle cx="433.161609962013" cy="926.4810086416065" r="14.299844349342534" fill="#FF4500"/><circle cx="707.0897841081804" cy="856.7518729443609" r="9.006245605833676" fill="#FF4500"/><circle cx="861.0138957153592" cy="801.2314017366874" r="11.286413087102904" fill="#FF4500"/><circle cx="463.0949683770971" cy="881.6294131916934" r="6.017956710456893" fill="#FF4500"/><circle cx="203.94655769901783" cy="883.6704556959903" r="5.392524799665999" fill="#FF4500"/><circle cx="5.161836613584159" cy="911.4531641792479" r="14.088584895644436" fill="#FF4500"/><circle cx="968.7363421592454" cy="929.7897750003884" r="11.55667428845641" fill="#FF4500"/><circle cx="265.28927587457065" cy="905.1286073986684" r="6.403538106982094" fill="#FF4500"/><circle cx="404.1778137785756" cy="880.1022561331627" r="14.407813618151335" fill="#FF4500"/><circle cx="99.24643522954324" cy="895.948614499956" r="10.28847707037855" fill="#FF4500"/><circle cx="542.4929301622042" cy="983.5105396250527" r="6.821676126443473" fill="#FF4500"/><circle cx="312.97211891637966" cy="996.9746949722065" r="9.016670235763202" fill="#FF4500"/><circle cx="201.77928668828304" cy="960.295071485324" r="12.847313627451857" fill="#FF4500"/><circle cx="883.7152831510072" cy="808.0380231691361" r="10.862324841408327" fill="#FF4500"/><circle cx="820.7918041045173" cy="990.2057818583661" r="8.188443849968623" fill="#FF4500"/><circle cx="950.8260108994782" cy="965.784131620208" r="14.3061676184519" fill="#FF4500"/><circle cx="462.99923769403574" cy="812.3162973515559" r="9.300224672453837" fill="#FF4500"/><circle cx="892.175135341121" cy="956.1611247782831" r="5.179221448168794" fill="#FF4500"/><circle cx="352.8278352921912" cy="866.8148289673497" r="7.4908063556943105" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #2450
  </text>

  
</svg>