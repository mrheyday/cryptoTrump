<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="770.9436660994917" cy="893.4288827145049" r="5.7811991814041015" fill="#FF4500"/><circle cx="457.37408776888276" cy="929.6678724758742" r="8.275855168697799" fill="#FF4500"/><circle cx="101.51565826913856" cy="811.332565977175" r="13.073777138240485" fill="#FF4500"/><circle cx="501.8284021517272" cy="974.4032518922941" r="7.608145337739258" fill="#FF4500"/><circle cx="5.265043924922885" cy="863.948582031401" r="12.60194114351376" fill="#FF4500"/><circle cx="623.2107818137496" cy="994.1958819998446" r="9.419752255823607" fill="#FF4500"/><circle cx="756.143059512405" cy="851.0437475406508" r="5.726032767805982" fill="#FF4500"/><circle cx="155.92903449849715" cy="902.6946475781047" r="5.2803043848483755" fill="#FF4500"/><circle cx="394.59897514514176" cy="992.5728459227751" r="10.316555372545464" fill="#FF4500"/><circle cx="375.53142091515343" cy="862.2788346895323" r="14.534435442149283" fill="#FF4500"/><circle cx="576.945524630057" cy="904.7070474946051" r="11.247286152309375" fill="#FF4500"/><circle cx="244.2163045400909" cy="976.4268220144365" r="13.673434251152754" fill="#FF4500"/><circle cx="971.2875152480281" cy="847.5431228487748" r="10.680946907630691" fill="#FF4500"/><circle cx="108.9927301171445" cy="919.6925420069571" r="9.756338619314262" fill="#FF4500"/><circle cx="341.194186506178" cy="923.3220982604005" r="8.317293383033501" fill="#FF4500"/><circle cx="149.11926579466007" cy="899.6491206161062" r="11.007482109501346" fill="#FF4500"/><circle cx="881.7657195089805" cy="995.7614782160427" r="12.281967842662727" fill="#FF4500"/><circle cx="955.5594081033368" cy="868.9205190877477" r="12.51286098275087" fill="#FF4500"/><circle cx="581.5765799458668" cy="913.8752644375774" r="12.505814111665256" fill="#FF4500"/><circle cx="92.85160613586841" cy="907.2472660473612" r="14.624869334976703" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #6908
  </text>

  
</svg>