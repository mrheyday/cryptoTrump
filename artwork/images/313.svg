<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B9F2FF"/>
  
        <!-- Diamond Pattern -->
        <g opacity="0.2">
          <circle cx="500" cy="500" r="300" fill="none" stroke="white" stroke-width="2"/>
          <circle cx="500" cy="500" r="400" fill="none" stroke="white" stroke-width="2"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <line x1="460" y1="410" x2="540" y2="410" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="117.10844829688494" cy="856.0020377537929" r="7.389851326695611" fill="#FF4500"/><circle cx="564.8747784516759" cy="986.4121022802713" r="5.504466952216567" fill="#FF4500"/><circle cx="405.78633867177905" cy="921.0053369548821" r="7.647060459687682" fill="#FF4500"/><circle cx="794.1254291597539" cy="936.0031163894056" r="7.824809341424592" fill="#FF4500"/><circle cx="808.3133508176235" cy="804.8261762189304" r="14.0319595487531" fill="#FF4500"/><circle cx="372.18549923787634" cy="895.6413688239231" r="7.089743538172854" fill="#FF4500"/><circle cx="147.80528342387055" cy="989.8571226446385" r="13.421208852526012" fill="#FF4500"/><circle cx="846.2952393020249" cy="901.0601891585186" r="14.256556383147753" fill="#FF4500"/><circle cx="45.019102205133606" cy="989.9293918562652" r="6.994222646624538" fill="#FF4500"/><circle cx="548.8357187402437" cy="948.9913941568246" r="13.480550147656079" fill="#FF4500"/><circle cx="730.9786246359773" cy="991.3353345195823" r="10.850746808309477" fill="#FF4500"/><circle cx="52.62965879436577" cy="959.108956445848" r="7.5090580856577605" fill="#FF4500"/><circle cx="969.1273628067205" cy="992.2320915550349" r="6.441883840600946" fill="#FF4500"/><circle cx="178.50005657757805" cy="919.1900150659452" r="6.148783376946838" fill="#FF4500"/><circle cx="992.4051184371227" cy="989.3861786507956" r="6.57319886547673" fill="#FF4500"/><circle cx="127.58243339134268" cy="949.9537638504971" r="10.384391441203677" fill="#FF4500"/><circle cx="821.2497364239348" cy="949.7931693063463" r="8.018413629535711" fill="#FF4500"/><circle cx="493.7425197046108" cy="890.3494418152097" r="11.467805317019073" fill="#FF4500"/><circle cx="462.52326652549147" cy="841.5976977711896" r="6.445555210364223" fill="#FF4500"/><circle cx="886.8162691483188" cy="974.1059088019343" r="9.419399141334399" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #313
  </text>

  
</svg>