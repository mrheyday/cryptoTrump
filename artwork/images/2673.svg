<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="154.6701096689771" cy="888.3661424802981" r="11.260033888935219" fill="#FF4500"/><circle cx="19.67956669298254" cy="914.0757373812428" r="13.407513796289468" fill="#FF4500"/><circle cx="415.9213084374052" cy="933.0304167253819" r="14.983000458774853" fill="#FF4500"/><circle cx="894.000328592269" cy="856.519229997352" r="10.230254934252086" fill="#FF4500"/><circle cx="639.7447071602671" cy="916.9798303021946" r="7.681044997304445" fill="#FF4500"/><circle cx="90.92548192802896" cy="801.3028936745687" r="8.377976116797106" fill="#FF4500"/><circle cx="567.4602060638585" cy="972.9085946856324" r="8.204396822844835" fill="#FF4500"/><circle cx="657.0884997851321" cy="863.5388772391481" r="13.457770189737897" fill="#FF4500"/><circle cx="566.1823632511582" cy="859.7822909188244" r="7.135875323554613" fill="#FF4500"/><circle cx="639.8860393546033" cy="900.2077599195684" r="6.16652459679189" fill="#FF4500"/><circle cx="687.3554343212911" cy="853.613099806553" r="12.908196295132118" fill="#FF4500"/><circle cx="468.8174766915563" cy="932.7189709606624" r="13.990889527784653" fill="#FF4500"/><circle cx="997.0147977729829" cy="887.6595118209102" r="9.696517031639472" fill="#FF4500"/><circle cx="895.8482829157857" cy="974.6965709089924" r="13.4255422024033" fill="#FF4500"/><circle cx="956.2371983652333" cy="948.9443210755193" r="13.959513086871363" fill="#FF4500"/><circle cx="705.965169120734" cy="807.5688682813748" r="11.229957181666602" fill="#FF4500"/><circle cx="70.19799612176824" cy="920.600583111437" r="11.090291662558853" fill="#FF4500"/><circle cx="861.3447112905226" cy="835.8820776010231" r="13.923047683150411" fill="#FF4500"/><circle cx="928.699476533611" cy="925.8108057869349" r="10.986051757191076" fill="#FF4500"/><circle cx="202.28123106188045" cy="893.3639017369123" r="9.915703266777303" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #2673
  </text>

  
</svg>