<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#355E3B"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFFFFF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9d9d9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9d9d9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="443.04235880210865" cy="928.5248811022844" r="7.715404553245482" fill="#FF4500"/><circle cx="487.4095182049911" cy="866.4653640553986" r="10.29212155059941" fill="#FF4500"/><circle cx="649.1046602559185" cy="850.9193987107665" r="12.758309684683535" fill="#FF4500"/><circle cx="780.2405059111088" cy="979.8303580900263" r="14.688991487006305" fill="#FF4500"/><circle cx="60.38903383365435" cy="858.6065944721431" r="11.604168501783402" fill="#FF4500"/><circle cx="865.3045596698374" cy="850.0473071450751" r="12.007270832947272" fill="#FF4500"/><circle cx="892.4890649078172" cy="918.7273920398359" r="12.48568678215107" fill="#FF4500"/><circle cx="717.6747769639826" cy="933.5658702000327" r="7.200598543950925" fill="#FF4500"/><circle cx="425.9110690695824" cy="912.4194825740726" r="13.062940628654436" fill="#FF4500"/><circle cx="522.5009004096432" cy="817.3953382239811" r="14.201393760577917" fill="#FF4500"/><circle cx="327.6640441069303" cy="971.1775024718647" r="7.528572342093849" fill="#FF4500"/><circle cx="709.9376702126792" cy="897.1620687615804" r="12.836877100640834" fill="#FF4500"/><circle cx="681.5222377303445" cy="894.7329312234975" r="8.233908983174752" fill="#FF4500"/><circle cx="996.712943241912" cy="877.9391957572017" r="6.777350076377857" fill="#FF4500"/><circle cx="990.1376128056589" cy="948.2353789048128" r="13.003911319495018" fill="#FF4500"/><circle cx="580.1260593129211" cy="833.5826026833248" r="5.437749972124186" fill="#FF4500"/><circle cx="409.5509904132937" cy="801.122245426471" r="14.864194890499334" fill="#FF4500"/><circle cx="664.5378656878161" cy="983.3806451529591" r="12.922738145732108" fill="#FF4500"/><circle cx="613.1034211204498" cy="890.2531897300564" r="14.205465294169999" fill="#FF4500"/><circle cx="397.77422045427755" cy="929.2902032851779" r="12.211222088914091" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #7333
  </text>

  
</svg>