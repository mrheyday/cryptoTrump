<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FFD700"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Presidential Seal --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="583.5557901514132" cy="902.4897312995594" r="10.343579507754848" fill="#FF4500"/><circle cx="548.7037265777855" cy="896.7120766140976" r="7.646578901951768" fill="#FF4500"/><circle cx="507.80323429167805" cy="944.1386575114874" r="10.265364948222253" fill="#FF4500"/><circle cx="19.14939548649741" cy="804.9143914511562" r="6.364296524519397" fill="#FF4500"/><circle cx="732.0818156903226" cy="906.4926879289285" r="9.393961115964235" fill="#FF4500"/><circle cx="336.6929674479875" cy="857.4248179608336" r="10.150619016892739" fill="#FF4500"/><circle cx="778.7488638280063" cy="900.8231585418185" r="10.476745616659514" fill="#FF4500"/><circle cx="809.2994978216774" cy="926.975008995641" r="8.272829957387343" fill="#FF4500"/><circle cx="730.9720169595948" cy="818.4094428522162" r="13.101307880932735" fill="#FF4500"/><circle cx="555.5908275710226" cy="847.0847484754161" r="12.380142144069115" fill="#FF4500"/><circle cx="213.62403495929482" cy="895.9326968139346" r="9.756463515941148" fill="#FF4500"/><circle cx="969.4422506037474" cy="839.443247352813" r="9.590839446336684" fill="#FF4500"/><circle cx="673.5247468640762" cy="861.6068265581466" r="10.299885994280178" fill="#FF4500"/><circle cx="988.9389032668636" cy="804.4915317767748" r="11.439066695679426" fill="#FF4500"/><circle cx="72.59515487124956" cy="818.9157171599159" r="13.857648482611218" fill="#FF4500"/><circle cx="679.5637202434319" cy="962.0507598252343" r="14.10337025502045" fill="#FF4500"/><circle cx="945.0043628227056" cy="866.7898011967573" r="12.63856362969176" fill="#FF4500"/><circle cx="204.11531501773328" cy="800.2382402483086" r="14.885531510800888" fill="#FF4500"/><circle cx="241.5720519922242" cy="922.6172771498129" r="14.649964169680139" fill="#FF4500"/><circle cx="220.51783486191877" cy="873.8159553168751" r="8.631337606461702" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #2707
  </text>

  
</svg>