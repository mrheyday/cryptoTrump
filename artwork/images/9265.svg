<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#B9F2FF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#93ccd9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#93ccd9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="174.92817358891367" cy="952.8705387972218" r="5.231664280677421" fill="#FF4500"/><circle cx="866.7816987002011" cy="986.4012292225251" r="7.009482383661938" fill="#FF4500"/><circle cx="567.7355170743115" cy="885.4854776807688" r="7.397902303526303" fill="#FF4500"/><circle cx="630.4421492714449" cy="803.918757383547" r="6.419863103771338" fill="#FF4500"/><circle cx="936.926983982268" cy="832.7760907323645" r="6.485079675132875" fill="#FF4500"/><circle cx="699.154408162489" cy="927.8793148057539" r="13.776191538210602" fill="#FF4500"/><circle cx="723.9986684517401" cy="855.7109146099422" r="7.365737247587802" fill="#FF4500"/><circle cx="0.09960129404373852" cy="990.2912094272759" r="12.05047812352647" fill="#FF4500"/><circle cx="21.666615082369" cy="803.807013218036" r="8.534485869178196" fill="#FF4500"/><circle cx="580.6442750587523" cy="952.5356782483904" r="13.282768113670562" fill="#FF4500"/><circle cx="716.8223109496803" cy="862.1081394114099" r="8.232359093350972" fill="#FF4500"/><circle cx="252.84798560668696" cy="988.6385414226102" r="10.50866694753437" fill="#FF4500"/><circle cx="819.4532777570556" cy="884.9987074785178" r="7.080340942879284" fill="#FF4500"/><circle cx="655.936957149665" cy="824.3920219663019" r="12.851781315058041" fill="#FF4500"/><circle cx="875.5279527483333" cy="979.9669935806261" r="7.80286639125409" fill="#FF4500"/><circle cx="340.8330721509725" cy="852.2780018314614" r="12.881324456941742" fill="#FF4500"/><circle cx="510.86246504812505" cy="953.9053097350818" r="11.461234226293005" fill="#FF4500"/><circle cx="887.5665056399897" cy="867.1606320570504" r="6.340668701692724" fill="#FF4500"/><circle cx="507.5699135971321" cy="951.5899033906038" r="10.089028171500257" fill="#FF4500"/><circle cx="102.78137307579938" cy="812.4112747530321" r="8.491975903589683" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9265
  </text>

  
</svg>