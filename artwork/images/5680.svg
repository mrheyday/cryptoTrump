<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E68C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6cc72;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#bdb359" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#bdb359" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="172.569010727313" cy="902.5859445116615" r="11.38880127604959" fill="#FF4500"/><circle cx="990.4222649951842" cy="884.0786507001197" r="7.483237192488705" fill="#FF4500"/><circle cx="96.36350876858768" cy="923.69086085035" r="13.330176678848897" fill="#FF4500"/><circle cx="555.8487449891336" cy="925.535487722626" r="5.941366893342592" fill="#FF4500"/><circle cx="813.7692916694949" cy="805.7459308826981" r="13.746960121680223" fill="#FF4500"/><circle cx="574.3120556275119" cy="832.5228308601199" r="8.683363325319458" fill="#FF4500"/><circle cx="912.6219012331649" cy="876.6606529980643" r="13.990174021318726" fill="#FF4500"/><circle cx="895.6783556837389" cy="843.7459756225564" r="9.975769902437051" fill="#FF4500"/><circle cx="338.4188272805442" cy="865.957748674085" r="14.153097976844318" fill="#FF4500"/><circle cx="84.52622051285164" cy="874.6912390374067" r="13.106290671341167" fill="#FF4500"/><circle cx="486.9507640991604" cy="944.4973479814753" r="13.267127163721415" fill="#FF4500"/><circle cx="22.488542559468307" cy="838.7625433502309" r="7.652724423879098" fill="#FF4500"/><circle cx="547.8984125838617" cy="964.4334105607795" r="12.787044526123443" fill="#FF4500"/><circle cx="533.8231783672325" cy="838.728128244461" r="13.066778835946701" fill="#FF4500"/><circle cx="900.4431843869844" cy="814.4329840755555" r="13.081072298335844" fill="#FF4500"/><circle cx="705.1474563233928" cy="981.6483157592965" r="9.390146525600162" fill="#FF4500"/><circle cx="548.2509039650354" cy="815.6867720351039" r="10.121966473207905" fill="#FF4500"/><circle cx="992.9350124518419" cy="854.3653540989485" r="8.86734861575625" fill="#FF4500"/><circle cx="547.9405322934791" cy="957.6243198036468" r="11.090642370172816" fill="#FF4500"/><circle cx="786.8099681695493" cy="984.4248949170642" r="11.351039968822645" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5680
  </text>

  
</svg>