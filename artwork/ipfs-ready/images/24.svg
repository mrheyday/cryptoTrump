<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Dollar Bills --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="269.94944991538694" cy="932.167031991708" r="12.190688456685546" fill="#FF4500"/><circle cx="590.0317997643551" cy="890.7411898714411" r="7.626073807178761" fill="#FF4500"/><circle cx="146.2302122033796" cy="926.1610455029481" r="12.845298886424327" fill="#FF4500"/><circle cx="767.7293209651215" cy="994.1562880624534" r="7.783699653520433" fill="#FF4500"/><circle cx="350.66641587213445" cy="995.0993991675712" r="7.055789731101574" fill="#FF4500"/><circle cx="478.2648424344347" cy="980.305568130965" r="13.405342942416565" fill="#FF4500"/><circle cx="806.1225415555311" cy="922.3535185619951" r="5.899994048365542" fill="#FF4500"/><circle cx="135.56648467588573" cy="913.4581534249597" r="8.606797531971356" fill="#FF4500"/><circle cx="332.6771742318324" cy="984.2739316289958" r="14.409961336904548" fill="#FF4500"/><circle cx="787.985346041945" cy="821.4912208606022" r="9.60929434855242" fill="#FF4500"/><circle cx="991.1121633985475" cy="978.5334688390815" r="13.173424266252095" fill="#FF4500"/><circle cx="348.48315429037393" cy="868.2743280598727" r="10.482379784603308" fill="#FF4500"/><circle cx="345.9090573303456" cy="929.4705973402112" r="5.425547399476223" fill="#FF4500"/><circle cx="166.9511171615714" cy="904.8019325815396" r="5.909866412057552" fill="#FF4500"/><circle cx="876.7138192779413" cy="920.0499160750851" r="11.346255709955491" fill="#FF4500"/><circle cx="162.02508534981442" cy="971.3884428538204" r="13.913289205141954" fill="#FF4500"/><circle cx="472.498025869865" cy="822.5778460726386" r="8.169181099180477" fill="#FF4500"/><circle cx="543.1691674552899" cy="977.6526981302491" r="9.337078298282488" fill="#FF4500"/><circle cx="374.6539561340252" cy="839.6616699328289" r="12.302390523877921" fill="#FF4500"/><circle cx="199.24143179762345" cy="842.8727804746009" r="13.001473205077286" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #24
  </text>

  
</svg>