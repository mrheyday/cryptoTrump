<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- American Flag Pin --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="612.7709255198632" cy="808.0425375317691" r="11.019890249914843" fill="#FF4500"/><circle cx="822.2318579547787" cy="825.2959586705008" r="11.511158548770322" fill="#FF4500"/><circle cx="262.32781731110833" cy="840.7859043904499" r="13.351949887069082" fill="#FF4500"/><circle cx="80.29783262914059" cy="906.9393941785942" r="9.816755172202576" fill="#FF4500"/><circle cx="303.74720766015105" cy="878.0642350558925" r="8.458437367095685" fill="#FF4500"/><circle cx="473.80921142976274" cy="817.3092655740434" r="9.566532245169647" fill="#FF4500"/><circle cx="53.63328034132997" cy="984.4604392790919" r="7.170406774696156" fill="#FF4500"/><circle cx="653.0918294844453" cy="908.1986814987134" r="9.145146276236618" fill="#FF4500"/><circle cx="209.6027332379171" cy="972.9079845272139" r="5.276889875889239" fill="#FF4500"/><circle cx="420.89465913330025" cy="876.5074027020617" r="6.7687604991448485" fill="#FF4500"/><circle cx="521.1478724306289" cy="834.360349535261" r="6.431774449489536" fill="#FF4500"/><circle cx="181.20656849441684" cy="857.188803326947" r="10.854351583121415" fill="#FF4500"/><circle cx="193.38322550682753" cy="982.3489737896275" r="9.813700151524959" fill="#FF4500"/><circle cx="779.5586186655488" cy="993.6889956961453" r="9.8510047219536" fill="#FF4500"/><circle cx="98.06232766789557" cy="970.1672491520219" r="5.2511158275716046" fill="#FF4500"/><circle cx="626.730740163707" cy="805.1023632853587" r="6.449524741962447" fill="#FF4500"/><circle cx="51.74670431870143" cy="861.4780998402914" r="5.161260032638633" fill="#FF4500"/><circle cx="829.2535995854151" cy="812.8587901697219" r="9.044851494542446" fill="#FF4500"/><circle cx="203.2808941081301" cy="842.0255041028707" r="11.003599649092" fill="#FF4500"/><circle cx="106.36690666217797" cy="804.5935041659022" r="9.016034043945336" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #7715
  </text>

  
</svg>