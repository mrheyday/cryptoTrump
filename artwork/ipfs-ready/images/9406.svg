<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <line x1="450" y1="315" x2="250" y2="230"
                stroke="#FF0000" stroke-width="8" opacity="0.8"/>
          <line x1="550" y1="315" x2="750" y2="230"
                stroke="#FF0000" stroke-width="8" opacity="0.8"/>
          <circle cx="450" cy="315" r="12" fill="#FF0000" opacity="0.9"/>
          <circle cx="550" cy="315" r="12" fill="#FF0000" opacity="0.9"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="922.4241926337327" cy="958.251924248922" r="6.760898773930732" fill="#FF4500"/><circle cx="242.7902399862769" cy="828.5337261587733" r="14.410995346079673" fill="#FF4500"/><circle cx="933.1270183621125" cy="910.1615327451267" r="11.912224501949645" fill="#FF4500"/><circle cx="632.1157682096399" cy="890.1871534359726" r="5.844592120304739" fill="#FF4500"/><circle cx="398.5260720763095" cy="907.8040594612754" r="14.480998379616079" fill="#FF4500"/><circle cx="806.9051849406266" cy="941.2307151482656" r="8.545315113915635" fill="#FF4500"/><circle cx="764.5535256066871" cy="849.7066653235293" r="13.438944648090645" fill="#FF4500"/><circle cx="656.2597381012436" cy="894.2407616098492" r="13.960263478772998" fill="#FF4500"/><circle cx="171.61456207403901" cy="802.6768876131823" r="6.572530266092295" fill="#FF4500"/><circle cx="994.5069748410281" cy="967.3789740450686" r="5.7665381057948295" fill="#FF4500"/><circle cx="39.39070566283376" cy="970.2321231771559" r="8.111883865891002" fill="#FF4500"/><circle cx="286.08609761539714" cy="910.1478467156181" r="8.74652790762549" fill="#FF4500"/><circle cx="605.7504080119795" cy="865.8558980272586" r="11.751042140924351" fill="#FF4500"/><circle cx="78.70067062741515" cy="807.645456608958" r="13.469118153957565" fill="#FF4500"/><circle cx="676.3832346797514" cy="967.2252748512526" r="14.805254339427735" fill="#FF4500"/><circle cx="474.0378463953607" cy="836.9069022493417" r="5.931797913547601" fill="#FF4500"/><circle cx="864.2020347265484" cy="825.6189325985642" r="6.4669289044970935" fill="#FF4500"/><circle cx="324.83585624247536" cy="890.3894667598057" r="10.718956352265227" fill="#FF4500"/><circle cx="993.6363550151668" cy="842.1664321562699" r="11.17618878496243" fill="#FF4500"/><circle cx="653.5056770493228" cy="988.4610839575795" r="7.379351357816573" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9406
  </text>

  
</svg>