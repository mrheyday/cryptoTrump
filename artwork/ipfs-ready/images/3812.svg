<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e55151;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc3838" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc3838" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="524.4182192567317" cy="884.4885354596925" r="13.91015642095434" fill="#FF4500"/><circle cx="505.86970499219694" cy="997.9813540095951" r="9.052976243328974" fill="#FF4500"/><circle cx="709.9023838108462" cy="923.85185481765" r="14.300999915566505" fill="#FF4500"/><circle cx="121.37884667363407" cy="876.3417617179427" r="12.335738216384371" fill="#FF4500"/><circle cx="491.3144522687456" cy="825.297377111798" r="5.34268101033126" fill="#FF4500"/><circle cx="626.9780955527447" cy="952.0531992329658" r="12.067786646979034" fill="#FF4500"/><circle cx="192.9424669736972" cy="967.5416070966396" r="14.222599216562893" fill="#FF4500"/><circle cx="541.8414246027144" cy="913.7152425134018" r="11.801575770830963" fill="#FF4500"/><circle cx="354.9831633268472" cy="987.890434684746" r="8.583418200073709" fill="#FF4500"/><circle cx="369.3434049803694" cy="833.4940239722768" r="12.864289595723534" fill="#FF4500"/><circle cx="205.38379666643513" cy="824.3512126546108" r="11.472158962552225" fill="#FF4500"/><circle cx="512.7856462470514" cy="920.8654340702755" r="13.902806071094325" fill="#FF4500"/><circle cx="454.74004130331025" cy="881.1308846197873" r="14.633506661349413" fill="#FF4500"/><circle cx="131.11463895191244" cy="902.3650486051531" r="6.374889008510081" fill="#FF4500"/><circle cx="759.038402515255" cy="894.1561603828752" r="8.800908496618762" fill="#FF4500"/><circle cx="654.7530003206034" cy="998.8179021211238" r="13.877356375383735" fill="#FF4500"/><circle cx="262.5957289582537" cy="895.6645453380905" r="10.918718954514247" fill="#FF4500"/><circle cx="917.8861346787402" cy="901.21574373338" r="5.543796538271167" fill="#FF4500"/><circle cx="790.4588849083434" cy="831.359718700606" r="11.315936726598384" fill="#FF4500"/><circle cx="814.1305027656005" cy="805.6802621692243" r="8.61489588560139" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #3812
  </text>

  
</svg>