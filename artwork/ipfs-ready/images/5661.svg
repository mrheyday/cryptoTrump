<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFFFFF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9d9d9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9d9d9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Doge Companion --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="585.392307566107" cy="939.8447713786036" r="13.757185009537064" fill="#FF4500"/><circle cx="518.2703921995264" cy="969.2218717278213" r="6.230299159479689" fill="#FF4500"/><circle cx="128.897201686355" cy="957.8181972262562" r="13.358716671262922" fill="#FF4500"/><circle cx="276.72918458532723" cy="955.928595804633" r="14.849074495072207" fill="#FF4500"/><circle cx="701.6470990291923" cy="917.6673376120983" r="13.349220823747164" fill="#FF4500"/><circle cx="44.92720559886276" cy="863.6028661698695" r="14.112037775670508" fill="#FF4500"/><circle cx="201.38984376593248" cy="883.1064627195935" r="13.338953794075062" fill="#FF4500"/><circle cx="71.65710010616944" cy="881.4917966190202" r="14.223002688727746" fill="#FF4500"/><circle cx="417.88376184065413" cy="983.33407456925" r="5.025442238147246" fill="#FF4500"/><circle cx="64.71824896790079" cy="894.0155841762394" r="6.311535493779696" fill="#FF4500"/><circle cx="613.1387030714359" cy="960.8647451319846" r="13.812477958715343" fill="#FF4500"/><circle cx="289.5508528141255" cy="977.2478171950538" r="12.394732136478414" fill="#FF4500"/><circle cx="381.8374581482773" cy="843.817040753353" r="12.90782859714428" fill="#FF4500"/><circle cx="890.7927170226752" cy="844.8136112793949" r="5.1979054419691" fill="#FF4500"/><circle cx="442.14987272228257" cy="926.1529167509117" r="14.193861209395918" fill="#FF4500"/><circle cx="325.952637320702" cy="847.5710277245714" r="6.444384700515564" fill="#FF4500"/><circle cx="971.359982754566" cy="872.0773816169985" r="11.659125021827954" fill="#FF4500"/><circle cx="93.96077030629569" cy="831.7222024248847" r="13.331903340931984" fill="#FF4500"/><circle cx="715.6190523464594" cy="874.5674666989718" r="10.78800262685477" fill="#FF4500"/><circle cx="324.67036309475515" cy="810.2092931166621" r="7.763253335398847" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #5661
  </text>

  
</svg>