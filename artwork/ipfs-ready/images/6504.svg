<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#B22234" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#8c000e" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#8c000e" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <line x1="460" y1="410" x2="540" y2="410" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="121.65067563025377" cy="985.4040863060706" r="5.331052569438739" fill="#FF4500"/><circle cx="641.5191585798245" cy="817.7430088593128" r="14.385156320382182" fill="#FF4500"/><circle cx="548.1119851363756" cy="969.2894135264868" r="7.754468832242036" fill="#FF4500"/><circle cx="600.23843888047" cy="945.9748601497088" r="14.246146903536708" fill="#FF4500"/><circle cx="161.49658000172894" cy="921.4776842483718" r="6.837172968623153" fill="#FF4500"/><circle cx="509.23237662756435" cy="842.5466920369004" r="13.494455305083735" fill="#FF4500"/><circle cx="51.508798177860584" cy="863.8810997472436" r="13.872397244971062" fill="#FF4500"/><circle cx="979.8722659556527" cy="973.6851894620158" r="5.322905570253833" fill="#FF4500"/><circle cx="780.5447495688096" cy="937.9497646379399" r="5.414705882445614" fill="#FF4500"/><circle cx="328.4288728073565" cy="834.9418746510603" r="7.071126337700928" fill="#FF4500"/><circle cx="187.6306339610705" cy="978.5177679315602" r="5.875505493575042" fill="#FF4500"/><circle cx="116.02855503395593" cy="982.1708413714113" r="14.672797904239467" fill="#FF4500"/><circle cx="893.6866547541151" cy="842.2444139860718" r="11.418709202922487" fill="#FF4500"/><circle cx="773.3605691578091" cy="958.8503996839734" r="8.13872889165524" fill="#FF4500"/><circle cx="596.1593372917979" cy="997.695522548984" r="12.97335307318718" fill="#FF4500"/><circle cx="703.0914412182518" cy="856.6238216683472" r="10.449920371117285" fill="#FF4500"/><circle cx="431.12854024995806" cy="840.2919015178709" r="5.431308342260232" fill="#FF4500"/><circle cx="643.7302099881949" cy="919.9838927325263" r="9.970589567075008" fill="#FF4500"/><circle cx="805.5949022229352" cy="956.1622253529358" r="9.56547082764776" fill="#FF4500"/><circle cx="333.8595747690238" cy="893.7629783132356" r="8.656310509358818" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #6504
  </text>

  
</svg>