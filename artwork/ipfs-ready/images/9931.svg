<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFD700" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9b100" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9b100" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="234.00060989734905" cy="820.7534028341062" r="8.130615421911411" fill="#FF4500"/><circle cx="931.6574762525212" cy="825.0167517577069" r="7.370861832936191" fill="#FF4500"/><circle cx="738.2517306638034" cy="838.8497756756661" r="12.798919329022889" fill="#FF4500"/><circle cx="640.2390794937273" cy="832.5615478613097" r="12.828634669368286" fill="#FF4500"/><circle cx="136.37879342821634" cy="914.8050658823688" r="7.280300210788826" fill="#FF4500"/><circle cx="705.3716052315735" cy="807.6785213456922" r="9.701186692715149" fill="#FF4500"/><circle cx="253.0816564028997" cy="873.0556343749491" r="5.5272173126932955" fill="#FF4500"/><circle cx="879.7048694505913" cy="984.22370027016" r="14.831907817712985" fill="#FF4500"/><circle cx="366.1696548784579" cy="927.5676732206597" r="14.878564801882446" fill="#FF4500"/><circle cx="524.6316550399197" cy="955.2015956499007" r="10.412557374623642" fill="#FF4500"/><circle cx="154.21147115199597" cy="831.9646959308511" r="10.102170048963133" fill="#FF4500"/><circle cx="785.5144276382601" cy="842.2527191809747" r="9.543562478746182" fill="#FF4500"/><circle cx="294.07620008507786" cy="963.5719759649863" r="6.469856799972695" fill="#FF4500"/><circle cx="895.0303709731809" cy="975.1289159678684" r="11.691579007181739" fill="#FF4500"/><circle cx="88.55052394808793" cy="950.1899598023356" r="5.182023261477484" fill="#FF4500"/><circle cx="870.9735747273379" cy="940.7636268522627" r="6.268986115877269" fill="#FF4500"/><circle cx="971.5805738656704" cy="982.9465198266611" r="13.726423019700064" fill="#FF4500"/><circle cx="597.8629979008488" cy="923.2954945159298" r="12.634760403604094" fill="#FF4500"/><circle cx="826.9686041926736" cy="806.4317011262104" r="10.387297485037866" fill="#FF4500"/><circle cx="37.49209256681696" cy="920.7010770260947" r="14.07080711884136" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9931
  </text>

  
</svg>