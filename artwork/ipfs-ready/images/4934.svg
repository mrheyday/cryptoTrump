<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cca400;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d9b100" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="764.8896059228416" cy="887.515813481506" r="10.775019972972107" fill="#FF4500"/><circle cx="743.5643237400859" cy="923.5203671815291" r="11.493645280175777" fill="#FF4500"/><circle cx="883.1726488713363" cy="880.554917754223" r="11.954639893911663" fill="#FF4500"/><circle cx="485.8079360416514" cy="993.9940502967522" r="9.421590617212477" fill="#FF4500"/><circle cx="533.9560500292259" cy="893.9997078682354" r="6.970442819547515" fill="#FF4500"/><circle cx="258.6506567493354" cy="981.1684511263317" r="8.309260674794402" fill="#FF4500"/><circle cx="300.3523351197297" cy="898.7547254377332" r="13.175579440739224" fill="#FF4500"/><circle cx="844.2444246961163" cy="995.6613290215789" r="6.068292590581614" fill="#FF4500"/><circle cx="115.35585081471544" cy="967.8461745414229" r="6.806272392028645" fill="#FF4500"/><circle cx="640.7023235527636" cy="950.0845024491168" r="5.97828687594975" fill="#FF4500"/><circle cx="441.1418838458139" cy="935.7812587321303" r="11.578270842925683" fill="#FF4500"/><circle cx="879.075301518244" cy="978.7217301956431" r="5.731649289626855" fill="#FF4500"/><circle cx="802.2614442299714" cy="800.7723300858092" r="11.388116562354602" fill="#FF4500"/><circle cx="711.63164575153" cy="909.2743782775318" r="14.65534711781717" fill="#FF4500"/><circle cx="582.162271263593" cy="966.3202932825615" r="9.974429315416858" fill="#FF4500"/><circle cx="203.70678621529171" cy="828.2201155442694" r="6.939261995206005" fill="#FF4500"/><circle cx="183.484169067613" cy="992.8696849857976" r="13.192244723323201" fill="#FF4500"/><circle cx="775.9833668955707" cy="844.9506145293484" r="6.383338140905557" fill="#FF4500"/><circle cx="860.3388337070724" cy="860.6811213297772" r="12.802539662619" fill="#FF4500"/><circle cx="57.529268467518826" cy="873.3033557251163" r="13.219848270455737" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4934
  </text>

  
</svg>