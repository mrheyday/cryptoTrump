<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="913.2626441490738" cy="997.5702975242187" r="13.095699725239577" fill="#FF4500"/><circle cx="245.54895749314" cy="815.0357219263904" r="5.583581761124301" fill="#FF4500"/><circle cx="324.3821492566494" cy="991.4385714511858" r="13.64582004336272" fill="#FF4500"/><circle cx="332.8548085806151" cy="877.7908783355116" r="11.94013413482461" fill="#FF4500"/><circle cx="544.2301810637484" cy="852.6255720892352" r="5.6657924082948234" fill="#FF4500"/><circle cx="192.2515167966783" cy="865.7407153491613" r="8.017248920239897" fill="#FF4500"/><circle cx="222.96343741539016" cy="916.3759202579113" r="10.069093498627183" fill="#FF4500"/><circle cx="96.36592231644569" cy="938.469890534993" r="12.324535762517762" fill="#FF4500"/><circle cx="36.453364455660164" cy="884.9097459083893" r="5.761985227076531" fill="#FF4500"/><circle cx="137.5118065093408" cy="805.1923086951156" r="7.61206578796979" fill="#FF4500"/><circle cx="279.22558644778326" cy="907.1958911200641" r="9.005998779265486" fill="#FF4500"/><circle cx="831.4110955996765" cy="859.0125078173569" r="14.330378242197161" fill="#FF4500"/><circle cx="664.7620128944965" cy="930.3210707592362" r="8.145821856264703" fill="#FF4500"/><circle cx="871.5482757649802" cy="803.2771479004168" r="8.054922124852322" fill="#FF4500"/><circle cx="792.843929815838" cy="926.2848683451709" r="13.216723534069137" fill="#FF4500"/><circle cx="17.811123538001183" cy="904.6875313703628" r="7.7080407372691155" fill="#FF4500"/><circle cx="591.7262639119814" cy="852.7144328986356" r="10.901989624444832" fill="#FF4500"/><circle cx="718.859741273117" cy="801.5172048360138" r="12.151554753612029" fill="#FF4500"/><circle cx="959.6398755391789" cy="969.5629741723178" r="13.482394267216335" fill="#FF4500"/><circle cx="119.0686084603012" cy="959.7127924861247" r="9.586683923868433" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #3404
  </text>

  
</svg>