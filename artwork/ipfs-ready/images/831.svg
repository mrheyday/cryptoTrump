<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#003366"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FFFFFF" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d9d9d9" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d9d9d9" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="774.8707781999987" cy="829.8716083311595" r="9.606513280658973" fill="#FF4500"/><circle cx="957.7463087628053" cy="890.2012336731814" r="6.596765896623323" fill="#FF4500"/><circle cx="143.1960467059632" cy="937.6257833449457" r="14.430552246386917" fill="#FF4500"/><circle cx="560.4592793402268" cy="929.7953091755514" r="12.590531208403153" fill="#FF4500"/><circle cx="55.51011381662874" cy="933.623538112812" r="11.898975271595214" fill="#FF4500"/><circle cx="726.4074523091484" cy="932.8165683348185" r="10.871388289482473" fill="#FF4500"/><circle cx="375.21918292291144" cy="981.0572402087171" r="13.218854266858514" fill="#FF4500"/><circle cx="34.58735463742401" cy="967.6649820182229" r="8.309227773251305" fill="#FF4500"/><circle cx="434.4258396347827" cy="861.362468233315" r="5.187727727152671" fill="#FF4500"/><circle cx="151.6638488571842" cy="823.7125214448334" r="12.355625011171142" fill="#FF4500"/><circle cx="701.1780656911983" cy="849.4518563623623" r="11.535548961194042" fill="#FF4500"/><circle cx="776.6390597337294" cy="894.5991777381951" r="8.66786255439312" fill="#FF4500"/><circle cx="505.7287637520518" cy="948.8889547069507" r="12.752461463342797" fill="#FF4500"/><circle cx="98.47421859605055" cy="827.210592999156" r="14.188566427409011" fill="#FF4500"/><circle cx="450.51768667447243" cy="945.259025833057" r="7.855548245691002" fill="#FF4500"/><circle cx="934.7698540778925" cy="861.854265023149" r="10.525072603190441" fill="#FF4500"/><circle cx="833.0093514569132" cy="935.8695259174308" r="14.075493137410904" fill="#FF4500"/><circle cx="452.7698502270443" cy="826.4584476478234" r="11.884732385901767" fill="#FF4500"/><circle cx="605.645174667021" cy="898.3728489716708" r="12.03065474930023" fill="#FF4500"/><circle cx="32.07888913946033" cy="971.1207718365756" r="13.030016279388041" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #831
  </text>

  
</svg>