<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#1DA1F2"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#B22234" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#8c000e" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#8c000e" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <line x1="460" y1="410" x2="540" y2="410" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="997.6993817338005" cy="994.9124328126984" r="10.689435490859736" fill="#FF4500"/><circle cx="864.2965901664317" cy="972.602237764899" r="11.890704995997506" fill="#FF4500"/><circle cx="650.7264626581397" cy="993.5228080741246" r="8.319953652708334" fill="#FF4500"/><circle cx="579.196546666481" cy="885.4873819129314" r="14.385180429525487" fill="#FF4500"/><circle cx="215.83322694846663" cy="822.0986570505453" r="13.072910431594988" fill="#FF4500"/><circle cx="290.5880694742822" cy="867.5686555645331" r="7.704406561588826" fill="#FF4500"/><circle cx="989.175447034423" cy="970.6436248895892" r="11.892924797083534" fill="#FF4500"/><circle cx="788.1697845354234" cy="864.5432512442126" r="13.662043479719877" fill="#FF4500"/><circle cx="987.4560293177808" cy="821.3609272737452" r="8.620424591049701" fill="#FF4500"/><circle cx="305.9195235078034" cy="888.3721444652747" r="12.914098548558053" fill="#FF4500"/><circle cx="79.54207814894332" cy="957.6411030265064" r="10.702879073115039" fill="#FF4500"/><circle cx="544.4413631459721" cy="914.9376997259044" r="7.2158406638570805" fill="#FF4500"/><circle cx="492.39601675990576" cy="870.0023918581119" r="14.484543998945856" fill="#FF4500"/><circle cx="972.0993845037258" cy="866.4299099770411" r="10.633595893664465" fill="#FF4500"/><circle cx="461.76604040052706" cy="975.4620081370576" r="6.882826506292292" fill="#FF4500"/><circle cx="430.42864296814275" cy="898.6910824057456" r="9.863749235502397" fill="#FF4500"/><circle cx="881.4216985107519" cy="810.0061075679273" r="5.709651712079986" fill="#FF4500"/><circle cx="332.4790839230702" cy="993.6047957190901" r="11.577682445378947" fill="#FF4500"/><circle cx="528.6253872896309" cy="851.8670183909745" r="6.383742213432275" fill="#FF4500"/><circle cx="8.229924794003862" cy="827.8868916236429" r="6.304461952274361" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #3990
  </text>

  
</svg>