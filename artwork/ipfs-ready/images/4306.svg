<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <circle cx="250" cy="650" r="25" fill="url(#goldGradient)" opacity="0.9"/>
          <text x="250" y="670" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
                fill="#8B4513" text-anchor="middle">$</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="345.50938817270935" cy="914.910465046911" r="12.424367119258577" fill="#FF4500"/><circle cx="570.90619246622" cy="990.3227537558878" r="10.153752703519093" fill="#FF4500"/><circle cx="831.1359115354915" cy="973.5884555716158" r="12.282740247820405" fill="#FF4500"/><circle cx="428.1399204128065" cy="973.2442626884173" r="10.0310180309795" fill="#FF4500"/><circle cx="228.13065004176346" cy="839.6694787236738" r="10.847591291241688" fill="#FF4500"/><circle cx="866.1208983335287" cy="843.702781197677" r="14.327796676658371" fill="#FF4500"/><circle cx="842.6741294037064" cy="961.0666266968273" r="13.214490656514686" fill="#FF4500"/><circle cx="725.8551541273816" cy="876.1167774872308" r="9.788048704236756" fill="#FF4500"/><circle cx="722.9066328452798" cy="872.3864703575214" r="7.837855009968977" fill="#FF4500"/><circle cx="813.498286412752" cy="870.5780210613897" r="9.737569152522012" fill="#FF4500"/><circle cx="321.2134311247117" cy="976.1893699842507" r="8.539383517834088" fill="#FF4500"/><circle cx="956.0247288897816" cy="939.528777891656" r="10.064213538966282" fill="#FF4500"/><circle cx="297.2990874410253" cy="910.3482306474934" r="5.292930871455857" fill="#FF4500"/><circle cx="154.54939854385995" cy="886.8384673989201" r="6.168920596331948" fill="#FF4500"/><circle cx="538.462998775846" cy="994.0430742063992" r="5.862200969522975" fill="#FF4500"/><circle cx="61.41973948307755" cy="997.6390813775226" r="8.131504489978376" fill="#FF4500"/><circle cx="633.225553298366" cy="852.4780915227169" r="7.4044205400690855" fill="#FF4500"/><circle cx="364.03284800945636" cy="883.1513414930295" r="10.451731994720221" fill="#FF4500"/><circle cx="112.99395697582982" cy="801.0377546921775" r="11.649228672009524" fill="#FF4500"/><circle cx="203.60367025731475" cy="822.3331096296282" r="10.312910524451624" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4306
  </text>

  
</svg>