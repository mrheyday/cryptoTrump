<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#8B4513" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#651f00" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#651f00" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="254.30213354490115" cy="902.0524543484275" r="11.594391561077186" fill="#FF4500"/><circle cx="867.9419810640243" cy="826.5462956489398" r="10.440923625094348" fill="#FF4500"/><circle cx="871.427242806233" cy="942.8850623519819" r="13.270414200196733" fill="#FF4500"/><circle cx="424.080486502733" cy="982.0493063124563" r="13.002001897899254" fill="#FF4500"/><circle cx="787.6336665391308" cy="909.6022256831031" r="7.705496546499697" fill="#FF4500"/><circle cx="431.1359341550143" cy="861.3552903365901" r="8.879191560685147" fill="#FF4500"/><circle cx="565.859825768568" cy="850.381534168229" r="7.738584770218841" fill="#FF4500"/><circle cx="781.8119757535338" cy="933.6388622591782" r="9.852423523215805" fill="#FF4500"/><circle cx="522.4898667221489" cy="835.6520612124682" r="14.64166477933501" fill="#FF4500"/><circle cx="473.2848841944546" cy="846.5670753626703" r="8.1575416661651" fill="#FF4500"/><circle cx="774.0555194203554" cy="838.2089292709758" r="12.341229556192122" fill="#FF4500"/><circle cx="190.5371268512186" cy="839.0152389972045" r="13.278275938438002" fill="#FF4500"/><circle cx="415.80432260860056" cy="990.2169058931562" r="12.91747292664465" fill="#FF4500"/><circle cx="538.6321916192112" cy="832.4476579918789" r="10.628354323591068" fill="#FF4500"/><circle cx="480.4156108854289" cy="914.1083114686019" r="13.359785978950882" fill="#FF4500"/><circle cx="384.71434710427087" cy="876.0844190710937" r="13.1968488414472" fill="#FF4500"/><circle cx="433.60365940856013" cy="962.468086289183" r="7.27415251191119" fill="#FF4500"/><circle cx="504.9640589727589" cy="803.9168296795128" r="12.481577499390022" fill="#FF4500"/><circle cx="99.97261033707771" cy="870.161747920157" r="10.222244533187535" fill="#FF4500"/><circle cx="28.42773719565517" cy="931.5927306683152" r="7.553905330893662" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9652
  </text>

  
</svg>