<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cca400;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d9b100" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b28a00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Golf Club --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="948.6502196070195" cy="949.2257293985392" r="12.377144168086163" fill="#FF4500"/><circle cx="549.6259259877708" cy="823.538450739441" r="8.480301147539366" fill="#FF4500"/><circle cx="797.4126883292123" cy="837.7349292361223" r="10.967908628944127" fill="#FF4500"/><circle cx="226.0710516341984" cy="864.4823539599209" r="10.854623323706443" fill="#FF4500"/><circle cx="665.6783311614824" cy="836.4751593417295" r="5.5987327753578375" fill="#FF4500"/><circle cx="177.0814598009014" cy="898.6271467266686" r="8.302730285076708" fill="#FF4500"/><circle cx="194.3887344350641" cy="931.1501922612608" r="10.66269036886216" fill="#FF4500"/><circle cx="965.297847888136" cy="939.3837173948468" r="10.258095544128665" fill="#FF4500"/><circle cx="712.3942958766594" cy="949.4650497641968" r="5.006936746017104" fill="#FF4500"/><circle cx="423.55730241319424" cy="858.9491403863459" r="13.530070794423331" fill="#FF4500"/><circle cx="12.55398145380715" cy="867.7022114166298" r="6.800438782500191" fill="#FF4500"/><circle cx="131.01931232487397" cy="881.1451770599907" r="11.628662422770383" fill="#FF4500"/><circle cx="946.9953495964944" cy="998.7720882237643" r="11.796706160576523" fill="#FF4500"/><circle cx="28.24958196961269" cy="887.3111908352442" r="9.195644838880204" fill="#FF4500"/><circle cx="718.6205743977654" cy="897.2132832690936" r="8.327786183622475" fill="#FF4500"/><circle cx="403.064452836676" cy="903.8090161047817" r="13.93831726576181" fill="#FF4500"/><circle cx="165.3264414624247" cy="877.9340190121709" r="6.669444575978067" fill="#FF4500"/><circle cx="531.7951732461854" cy="879.9937431683896" r="8.133490390895336" fill="#FF4500"/><circle cx="413.0781442274514" cy="944.495308537802" r="11.531935378500142" fill="#FF4500"/><circle cx="152.04772670516542" cy="867.4067698057823" r="11.725680912235166" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #2734
  </text>

  
</svg>