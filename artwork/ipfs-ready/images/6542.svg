<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FFD700"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <rect x="410" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <rect x="520" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <line x1="480" y1="330" x2="520" y2="330" stroke="#000000" stroke-width="3"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="296.7336430702636" cy="846.1158157141987" r="6.412704787880048" fill="#FF4500"/><circle cx="669.7478646644963" cy="974.4948938506907" r="10.609486123049274" fill="#FF4500"/><circle cx="434.2219531948459" cy="944.5565068844325" r="7.06787079239753" fill="#FF4500"/><circle cx="662.4371356387812" cy="841.9337429885023" r="6.454235645871272" fill="#FF4500"/><circle cx="111.32776136004784" cy="961.6177789501168" r="10.624020857056568" fill="#FF4500"/><circle cx="259.1942532495883" cy="905.2954028725437" r="13.890138682694763" fill="#FF4500"/><circle cx="994.7709310939066" cy="826.0829266502521" r="5.154330897041115" fill="#FF4500"/><circle cx="983.6356819754088" cy="918.4635743144909" r="12.09089654535951" fill="#FF4500"/><circle cx="91.48189923149785" cy="918.8579852512914" r="11.695787738399154" fill="#FF4500"/><circle cx="12.719608823202666" cy="944.2491546781869" r="7.874488893641729" fill="#FF4500"/><circle cx="829.478842472902" cy="882.7622879417455" r="5.388121957211367" fill="#FF4500"/><circle cx="675.5709885867069" cy="990.2097782505778" r="12.287255651165568" fill="#FF4500"/><circle cx="973.3183752668056" cy="891.0288146823706" r="5.008638437874202" fill="#FF4500"/><circle cx="687.2723273452308" cy="961.8037075568419" r="6.382997913514112" fill="#FF4500"/><circle cx="117.68270174031814" cy="915.6274953184586" r="11.821673938500648" fill="#FF4500"/><circle cx="773.4757677522708" cy="864.5684057868347" r="8.613745234243053" fill="#FF4500"/><circle cx="249.65117042376406" cy="967.8252866240273" r="5.89120864909165" fill="#FF4500"/><circle cx="59.4045150985425" cy="832.4207828009704" r="14.001818000238401" fill="#FF4500"/><circle cx="926.5118678412285" cy="857.4854436131784" r="5.814550293705154" fill="#FF4500"/><circle cx="323.9543365196862" cy="868.5148732293787" r="9.078673807855635" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #6542
  </text>

  
</svg>