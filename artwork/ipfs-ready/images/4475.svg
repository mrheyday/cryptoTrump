<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5900;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d96600" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b23f00" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="522.3506039808157" cy="859.5611387445716" r="12.066664111694752" fill="#FF4500"/><circle cx="54.359083415755016" cy="872.3679041154162" r="14.920182615764613" fill="#FF4500"/><circle cx="9.615702955835914" cy="926.5132038320693" r="14.070070629672436" fill="#FF4500"/><circle cx="857.329777136498" cy="819.4071333503053" r="9.919281312000114" fill="#FF4500"/><circle cx="421.8527009824107" cy="802.2265930456774" r="14.402882337710398" fill="#FF4500"/><circle cx="559.8722113119757" cy="944.622058325532" r="9.31493718074854" fill="#FF4500"/><circle cx="637.1476107896005" cy="810.3639304805928" r="6.675587274419388" fill="#FF4500"/><circle cx="986.5760974625948" cy="885.4585344983303" r="5.377181059072964" fill="#FF4500"/><circle cx="109.39842799202503" cy="936.925118686475" r="13.377784019201824" fill="#FF4500"/><circle cx="124.24499962437952" cy="988.741164666477" r="8.851543009491147" fill="#FF4500"/><circle cx="646.4324936034458" cy="826.5385603640048" r="11.986663088331946" fill="#FF4500"/><circle cx="947.4645398171109" cy="954.5373087371156" r="7.310507239789706" fill="#FF4500"/><circle cx="229.3715754914123" cy="829.5880113034814" r="9.97366145157816" fill="#FF4500"/><circle cx="427.15832971151514" cy="867.2684256059501" r="12.908070156362507" fill="#FF4500"/><circle cx="147.57421906769318" cy="884.755862111891" r="12.172880181537199" fill="#FF4500"/><circle cx="854.7582621440541" cy="991.5380142957536" r="9.733624053980234" fill="#FF4500"/><circle cx="85.94624976512" cy="944.6323594135772" r="8.83594775072428" fill="#FF4500"/><circle cx="176.4704034442437" cy="957.8405027362876" r="5.3159654922867094" fill="#FF4500"/><circle cx="324.0621607215457" cy="970.1600673772797" r="7.187010362845198" fill="#FF4500"/><circle cx="692.3775230290503" cy="911.0013731608897" r="6.194066191679795" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4475
  </text>

  
</svg>