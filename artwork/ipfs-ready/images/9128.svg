<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="593.4081812971781" cy="858.6241770285958" r="8.294445831742642" fill="#FF4500"/><circle cx="21.14282817922919" cy="865.5037882648795" r="8.984384309995983" fill="#FF4500"/><circle cx="928.6126082849017" cy="862.010640362271" r="7.392441482059009" fill="#FF4500"/><circle cx="751.0799532060511" cy="947.8334486730806" r="7.069009199988006" fill="#FF4500"/><circle cx="390.8251608950133" cy="838.2582515486176" r="8.224323957696196" fill="#FF4500"/><circle cx="198.75844541274466" cy="815.3342354852391" r="5.121487219054231" fill="#FF4500"/><circle cx="452.57229944555075" cy="898.4676374872647" r="13.40596097108457" fill="#FF4500"/><circle cx="330.00266679383805" cy="830.3901111402336" r="13.7090734558527" fill="#FF4500"/><circle cx="686.6228171503259" cy="967.900911705769" r="10.767607788846096" fill="#FF4500"/><circle cx="640.1251672937307" cy="818.565443877822" r="14.89776219478892" fill="#FF4500"/><circle cx="421.01639444115824" cy="868.8174917071894" r="10.871191445681777" fill="#FF4500"/><circle cx="299.41230873148214" cy="863.7402187556976" r="10.308806175169817" fill="#FF4500"/><circle cx="484.7551982796745" cy="932.1597176448522" r="5.507059275224206" fill="#FF4500"/><circle cx="95.21165603849013" cy="943.0134925680162" r="9.499830173383701" fill="#FF4500"/><circle cx="554.3095721594" cy="995.9200624442991" r="6.956698572193822" fill="#FF4500"/><circle cx="150.18773887491378" cy="957.5911490081621" r="9.200978855110158" fill="#FF4500"/><circle cx="170.25643137232737" cy="935.8757002242722" r="11.419502337653968" fill="#FF4500"/><circle cx="76.05086510548165" cy="913.8448274309662" r="6.873375562902762" fill="#FF4500"/><circle cx="719.5142477289394" cy="835.9490090765603" r="10.290826478738953" fill="#FF4500"/><circle cx="905.1937690076337" cy="879.6846394616565" r="6.087664842526168" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9128
  </text>

  
</svg>