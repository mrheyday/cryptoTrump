<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FFD700"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="595.4039433088392" cy="941.329237534805" r="9.84317977231414" fill="#FF4500"/><circle cx="762.9114331999644" cy="824.2028152835496" r="12.920716891789368" fill="#FF4500"/><circle cx="802.1494031885472" cy="950.3590769982884" r="14.135171301018438" fill="#FF4500"/><circle cx="61.572057000950586" cy="909.0689045859738" r="10.507242639343751" fill="#FF4500"/><circle cx="692.3158511707342" cy="969.6962808207253" r="11.006212300570388" fill="#FF4500"/><circle cx="138.2301582069565" cy="957.6340305984625" r="5.787166364020386" fill="#FF4500"/><circle cx="942.1657265902251" cy="852.5186758333803" r="13.609369478964497" fill="#FF4500"/><circle cx="397.0601582068367" cy="989.6619628212012" r="14.451057433260111" fill="#FF4500"/><circle cx="937.2036546211016" cy="934.7089695233184" r="8.84904726858218" fill="#FF4500"/><circle cx="534.8876388560537" cy="937.4793832765865" r="6.25888225074942" fill="#FF4500"/><circle cx="600.5382433069375" cy="851.3787977650213" r="11.656400626081702" fill="#FF4500"/><circle cx="178.6448032961614" cy="819.6336655866698" r="10.943406015922761" fill="#FF4500"/><circle cx="611.6344791024131" cy="899.3148442058923" r="14.450753841172956" fill="#FF4500"/><circle cx="396.14988327021393" cy="935.5150038316962" r="7.049846665934059" fill="#FF4500"/><circle cx="830.2482005538508" cy="956.2316454056734" r="11.787380284160214" fill="#FF4500"/><circle cx="219.8739859998584" cy="869.7665643664529" r="6.802351106177939" fill="#FF4500"/><circle cx="749.4706172948124" cy="903.0835168481843" r="7.981970978546354" fill="#FF4500"/><circle cx="989.9320365930562" cy="862.7753467651643" r="14.49818805759745" fill="#FF4500"/><circle cx="371.4994208861313" cy="899.1640525708149" r="12.297232620261532" fill="#FF4500"/><circle cx="797.7206669343013" cy="931.764837942603" r="7.4090619701824245" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #952
  </text>

  
</svg>