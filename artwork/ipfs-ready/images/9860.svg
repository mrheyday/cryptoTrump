<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B22234"/>
  
        <!-- American Flag Stripes -->
        <g opacity="0.3">
          <rect y="0" width="1000" height="76.92307692307692" fill="white"/><rect y="153.84615384615384" width="1000" height="76.92307692307692" fill="white"/><rect y="307.6923076923077" width="1000" height="76.92307692307692" fill="white"/><rect y="461.53846153846155" width="1000" height="76.92307692307692" fill="white"/><rect y="615.3846153846154" width="1000" height="76.92307692307692" fill="white"/><rect y="769.2307692307692" width="1000" height="76.92307692307692" fill="white"/><rect y="923.0769230769231" width="1000" height="76.92307692307692" fill="white"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
          <!-- Wind Blown Effect -->
          <path d="M 680,230 Q 750,200 780,250"
                fill="url(#hairGradient)" opacity="0.8"/>
        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- American Flag Pin --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="517.7303673878928" cy="911.9203542111551" r="12.144700599964331" fill="#FF4500"/><circle cx="468.2912462085285" cy="870.2243470488843" r="12.408479956599452" fill="#FF4500"/><circle cx="994.6458214358398" cy="928.7671543524644" r="9.498519704896076" fill="#FF4500"/><circle cx="417.05003510143257" cy="906.3601629628932" r="6.056445865317865" fill="#FF4500"/><circle cx="412.0932843918914" cy="992.546522990199" r="11.825829512842539" fill="#FF4500"/><circle cx="826.8437928559265" cy="858.6750319268812" r="8.547551481416827" fill="#FF4500"/><circle cx="523.6006958367523" cy="864.0009773139171" r="7.067072526338691" fill="#FF4500"/><circle cx="229.5431644851569" cy="848.5211178845732" r="13.666041078949377" fill="#FF4500"/><circle cx="706.8814825242715" cy="933.0735150238413" r="9.11813203333967" fill="#FF4500"/><circle cx="385.97397414879464" cy="994.5101249361663" r="8.812625428318077" fill="#FF4500"/><circle cx="897.9894535115154" cy="929.7125610001718" r="6.842909544803142" fill="#FF4500"/><circle cx="446.69020385488477" cy="997.8997856582635" r="7.2031549017418905" fill="#FF4500"/><circle cx="868.8779942321964" cy="928.6841454679617" r="13.781129596360342" fill="#FF4500"/><circle cx="131.7654374287931" cy="951.7004493020853" r="14.367095174485844" fill="#FF4500"/><circle cx="859.7451513757135" cy="828.0023589743821" r="14.572262713857782" fill="#FF4500"/><circle cx="698.6034642674331" cy="925.960538432251" r="7.797191941812562" fill="#FF4500"/><circle cx="905.267595723644" cy="965.8234466236172" r="13.993835645942646" fill="#FF4500"/><circle cx="834.0021483631228" cy="980.9859950176561" r="12.501521175112668" fill="#FF4500"/><circle cx="659.0649415291856" cy="897.0451135675953" r="9.250997638509384" fill="#FF4500"/><circle cx="723.4987421767753" cy="990.8783228802473" r="6.7032594653194195" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9860
  </text>

  
</svg>