<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#DAA520"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#8B4513" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#651f00" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#651f00" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- American Flag Pin --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="72.69639298301666" cy="938.8668375359272" r="12.533143293207802" fill="#FF4500"/><circle cx="737.8669020212632" cy="836.6566496750094" r="14.449575674226109" fill="#FF4500"/><circle cx="569.6360697900164" cy="935.4191017733797" r="5.444433428833067" fill="#FF4500"/><circle cx="99.06855252824842" cy="897.12105825766" r="6.731365577455901" fill="#FF4500"/><circle cx="557.3628103937975" cy="853.8067078344422" r="7.549688167827244" fill="#FF4500"/><circle cx="168.77076836282146" cy="881.4234258875508" r="8.357183826198721" fill="#FF4500"/><circle cx="665.2488002934542" cy="859.6110511517446" r="10.036309478216598" fill="#FF4500"/><circle cx="146.85584175289557" cy="869.3819520743721" r="11.821820941032188" fill="#FF4500"/><circle cx="119.4657194552815" cy="805.5662802571974" r="12.785931979976082" fill="#FF4500"/><circle cx="220.91590322938703" cy="899.5599637692965" r="13.988219937394863" fill="#FF4500"/><circle cx="35.945109896629916" cy="876.495922985795" r="6.238492171155244" fill="#FF4500"/><circle cx="13.61495389801437" cy="964.1404344530541" r="9.376837455605383" fill="#FF4500"/><circle cx="379.3769166596397" cy="918.7250024541148" r="6.652496025692496" fill="#FF4500"/><circle cx="665.8750661646613" cy="805.9310801022473" r="14.002822285520258" fill="#FF4500"/><circle cx="189.31367173848156" cy="964.9773840929246" r="7.589500392358223" fill="#FF4500"/><circle cx="103.921348236504" cy="875.088959261871" r="14.55076151076036" fill="#FF4500"/><circle cx="385.2206510507623" cy="897.3498324375446" r="6.576376900252074" fill="#FF4500"/><circle cx="381.82148826628094" cy="980.2925988230068" r="10.266802303122697" fill="#FF4500"/><circle cx="779.0134365206443" cy="985.1948660527014" r="6.862724992421587" fill="#FF4500"/><circle cx="880.8710411468062" cy="860.8667019550529" r="5.672724557500439" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #70
  </text>

  
</svg>