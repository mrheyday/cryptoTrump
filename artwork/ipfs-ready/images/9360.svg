<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e58b00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#B9F2FF"/>
  
        <!-- Diamond Pattern -->
        <g opacity="0.2">
          <circle cx="500" cy="500" r="300" fill="none" stroke="white" stroke-width="2"/>
          <circle cx="500" cy="500" r="400" fill="none" stroke="white" stroke-width="2"/>
        </g>

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#000080" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#00005a" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#00005a" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cc7200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <rect x="410" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <rect x="520" y="310" width="70" height="40" rx="10" fill="#000000" opacity="0.8"/>
          <line x1="480" y1="330" x2="520" y2="330" stroke="#000000" stroke-width="3"/>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="300.4849153169511" cy="802.996796363503" r="12.826680506589161" fill="#FF4500"/><circle cx="373.2979800088476" cy="858.7653127458543" r="11.018628409445338" fill="#FF4500"/><circle cx="10.791799095739574" cy="876.2988084436829" r="12.159747089598937" fill="#FF4500"/><circle cx="760.3253031717198" cy="937.8128712560465" r="8.976293694988227" fill="#FF4500"/><circle cx="702.3702383102064" cy="883.123796842089" r="12.470216273426013" fill="#FF4500"/><circle cx="790.5303094395679" cy="816.4965719222389" r="10.650041923624647" fill="#FF4500"/><circle cx="366.3546031151346" cy="997.8380963521089" r="11.399136767073347" fill="#FF4500"/><circle cx="584.1245896234046" cy="845.3676235201251" r="6.691344357833733" fill="#FF4500"/><circle cx="892.3695137849019" cy="994.9532559796796" r="6.951912436627419" fill="#FF4500"/><circle cx="63.34878864073579" cy="898.0161037973967" r="14.679190392861779" fill="#FF4500"/><circle cx="132.48149522754971" cy="948.9657737833876" r="8.298847921174657" fill="#FF4500"/><circle cx="121.10352987860873" cy="863.862207047913" r="7.963767026631858" fill="#FF4500"/><circle cx="885.9734569299243" cy="839.477601237079" r="10.398491199799222" fill="#FF4500"/><circle cx="52.387033671781765" cy="911.898965456719" r="12.396083047070423" fill="#FF4500"/><circle cx="921.0412680898836" cy="815.3922622252878" r="5.203299534937624" fill="#FF4500"/><circle cx="346.1932772050933" cy="978.9583139606844" r="9.485823142322591" fill="#FF4500"/><circle cx="576.7041424304515" cy="862.061516755981" r="6.810652080295436" fill="#FF4500"/><circle cx="467.9330480864652" cy="937.4387732226708" r="14.726128425160248" fill="#FF4500"/><circle cx="616.579795811614" cy="963.8596226085555" r="14.91596377577122" fill="#FF4500"/><circle cx="234.6273584041123" cy="949.5200513553092" r="7.643479402790727" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9360
  </text>

  
</svg>