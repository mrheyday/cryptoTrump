<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#F5F5DC"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#36454F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#101f29" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#101f29" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="940.6444149281479" cy="958.0960700973565" r="8.618163587281868" fill="#FF4500"/><circle cx="711.3174047048744" cy="857.062784168094" r="6.633655024909119" fill="#FF4500"/><circle cx="309.84077624099496" cy="931.5801097953046" r="8.056710169222832" fill="#FF4500"/><circle cx="36.124594940432516" cy="979.3600472547304" r="8.857975535057946" fill="#FF4500"/><circle cx="906.9499450362115" cy="867.7665915645707" r="13.553611764640634" fill="#FF4500"/><circle cx="472.67497085669083" cy="930.0958161694621" r="8.247952998477867" fill="#FF4500"/><circle cx="552.840653736049" cy="876.2582718624343" r="12.86217195274346" fill="#FF4500"/><circle cx="184.93085747784033" cy="821.4416024637782" r="11.128148068026816" fill="#FF4500"/><circle cx="532.2042912922498" cy="990.3991676321564" r="14.556577731004033" fill="#FF4500"/><circle cx="303.2114158573047" cy="993.9308465464386" r="11.411418833195404" fill="#FF4500"/><circle cx="999.6231030718245" cy="934.3055471950768" r="13.285228609671101" fill="#FF4500"/><circle cx="157.88765643040037" cy="863.169948446274" r="6.847608871814057" fill="#FF4500"/><circle cx="574.1220799135356" cy="835.488452096369" r="9.992784558455163" fill="#FF4500"/><circle cx="784.0519426179413" cy="866.2474605883218" r="10.368194481987329" fill="#FF4500"/><circle cx="143.4956821117688" cy="962.8520605750392" r="7.721382745555587" fill="#FF4500"/><circle cx="918.075979282176" cy="995.0629792189693" r="10.921625470532776" fill="#FF4500"/><circle cx="800.2294735591408" cy="919.8106946509546" r="9.54930408875472" fill="#FF4500"/><circle cx="832.5319029153861" cy="993.9621769893281" r="7.214544909873151" fill="#FF4500"/><circle cx="968.0393677448826" cy="875.5150243439695" r="8.528048036806638" fill="#FF4500"/><circle cx="432.8008498018576" cy="812.9857573666715" r="14.097874654895495" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4783
  </text>

  
</svg>