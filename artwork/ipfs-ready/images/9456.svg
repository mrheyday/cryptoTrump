<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="830.8444111569282" cy="872.1677654194682" r="9.570136088528509" fill="#FF4500"/><circle cx="915.1864336291364" cy="964.0341117285253" r="12.745491275715978" fill="#FF4500"/><circle cx="841.7936857989121" cy="946.602241189077" r="8.136374668327505" fill="#FF4500"/><circle cx="371.82882946909234" cy="924.4997158787351" r="14.73133418033456" fill="#FF4500"/><circle cx="451.5985148738251" cy="883.8226290237952" r="6.836180427036551" fill="#FF4500"/><circle cx="217.61340461905388" cy="878.6434757586924" r="5.110553573201577" fill="#FF4500"/><circle cx="288.9263408537941" cy="966.3909584143042" r="8.91799214643158" fill="#FF4500"/><circle cx="871.2075428605056" cy="918.4328359390959" r="12.81549513084228" fill="#FF4500"/><circle cx="455.97741976771266" cy="894.3180743674767" r="11.05179716400491" fill="#FF4500"/><circle cx="890.5320159706041" cy="807.5631961905337" r="14.03720015169582" fill="#FF4500"/><circle cx="457.20426924684807" cy="946.5966979004866" r="14.969434507216892" fill="#FF4500"/><circle cx="289.1402176643705" cy="999.0090202109576" r="14.950614822988815" fill="#FF4500"/><circle cx="476.1989740958568" cy="887.5590554698394" r="10.785222510439281" fill="#FF4500"/><circle cx="923.100109981383" cy="830.3888885943388" r="5.195321069522148" fill="#FF4500"/><circle cx="453.09265698536507" cy="809.6027011718556" r="12.475719746000934" fill="#FF4500"/><circle cx="345.8690738175754" cy="984.1143857923863" r="12.707627460169327" fill="#FF4500"/><circle cx="173.9730823551875" cy="915.8210394531167" r="8.633462312625204" fill="#FF4500"/><circle cx="300.07439591684124" cy="988.6498660479219" r="12.727815543834772" fill="#FF4500"/><circle cx="896.632335548723" cy="978.1956140226652" r="12.563602029145171" fill="#FF4500"/><circle cx="802.0553696476553" cy="948.2749627182465" r="14.771097252475583" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9456
  </text>

  
</svg>