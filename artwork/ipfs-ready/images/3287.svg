<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7200;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#DAA520"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#003366" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#000d40" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#000d40" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d97f00" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b25800" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Presidential Seal --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="666.9070608434075" cy="871.5933828156519" r="10.722355379697063" fill="#FF4500"/><circle cx="470.0991280736937" cy="885.8913071303585" r="10.268942623910656" fill="#FF4500"/><circle cx="739.9540736805872" cy="998.9839737522401" r="10.895325144711832" fill="#FF4500"/><circle cx="646.0291383647649" cy="873.9936215102987" r="14.715034945977443" fill="#FF4500"/><circle cx="867.1589512445838" cy="874.3058080169342" r="7.290135956095877" fill="#FF4500"/><circle cx="183.7437997060345" cy="905.0520080949527" r="8.638063723394323" fill="#FF4500"/><circle cx="911.2845425898332" cy="802.5283507390625" r="13.35101217153866" fill="#FF4500"/><circle cx="430.53260782793615" cy="994.4440188924608" r="11.343054525970398" fill="#FF4500"/><circle cx="483.4210717752665" cy="814.0120244986389" r="5.343064251304071" fill="#FF4500"/><circle cx="544.8945079233722" cy="850.3997507697121" r="11.565297376682345" fill="#FF4500"/><circle cx="968.8244980857021" cy="993.5502923705195" r="7.476199637784249" fill="#FF4500"/><circle cx="119.84266785189047" cy="908.1829469372515" r="14.86244391333744" fill="#FF4500"/><circle cx="81.55019446737177" cy="829.9045993821633" r="10.231185297959321" fill="#FF4500"/><circle cx="421.3789960132641" cy="846.5757568984832" r="12.2038413204109" fill="#FF4500"/><circle cx="809.5512032588714" cy="881.8570166431371" r="8.786255386260034" fill="#FF4500"/><circle cx="908.0848841344282" cy="980.0996644489954" r="12.871232295876915" fill="#FF4500"/><circle cx="199.03026616490283" cy="955.5726822761222" r="8.523509875485471" fill="#FF4500"/><circle cx="431.9756089163913" cy="832.6464918848967" r="12.267007840180051" fill="#FF4500"/><circle cx="979.6242224836423" cy="824.0885822178141" r="6.485884477950339" fill="#FF4500"/><circle cx="149.401531140124" cy="957.5893112924238" r="11.355535624418634" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #3287
  </text>

  
</svg>