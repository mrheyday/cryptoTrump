<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c08b06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#a77200" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  
        <g id="accessory">
          <ellipse cx="500" cy="150" rx="180" ry="30" fill="#FF0000"/>
          <path d="M 300,150 Q 500,120 700,150"
                fill="#FF0000"/>
          <text x="500" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
                fill="white" text-anchor="middle">MAGA</text>
        </g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="497.1236989285004" cy="944.1505245403466" r="11.776613692137879" fill="#FF4500"/><circle cx="887.9417224518811" cy="846.1020578781458" r="9.619859838453824" fill="#FF4500"/><circle cx="896.850030487928" cy="856.7463602352923" r="7.403684180504615" fill="#FF4500"/><circle cx="807.0438226272605" cy="935.6045095716572" r="13.621796668757122" fill="#FF4500"/><circle cx="921.893761892863" cy="879.3331464043356" r="14.67645824775442" fill="#FF4500"/><circle cx="134.66743367115487" cy="849.5412806660037" r="14.693387871541841" fill="#FF4500"/><circle cx="2.906348582897289" cy="874.0971243244406" r="12.296129592543256" fill="#FF4500"/><circle cx="177.73094336731666" cy="955.0876693084422" r="8.826296878816592" fill="#FF4500"/><circle cx="178.83127429937673" cy="902.011938265249" r="9.65869445310606" fill="#FF4500"/><circle cx="550.4929454811827" cy="890.9491911313661" r="6.310576381877285" fill="#FF4500"/><circle cx="528.3605071523278" cy="803.0872260444314" r="6.6292647411219585" fill="#FF4500"/><circle cx="735.6774108136226" cy="916.1814541435078" r="9.903214830015738" fill="#FF4500"/><circle cx="901.414863792587" cy="894.7188826727552" r="8.88796688773297" fill="#FF4500"/><circle cx="117.57063648067457" cy="838.7599777480626" r="13.770632971962511" fill="#FF4500"/><circle cx="352.65320010413336" cy="997.8582210381112" r="6.335486745424039" fill="#FF4500"/><circle cx="525.2111735640206" cy="977.7244157364936" r="7.004143789989148" fill="#FF4500"/><circle cx="28.488893305646414" cy="882.9741565691475" r="12.838815870567597" fill="#FF4500"/><circle cx="21.716278469154915" cy="898.6313748277638" r="5.155140793498498" fill="#FF4500"/><circle cx="636.8845855801964" cy="871.2928052711688" r="9.30301834647888" fill="#FF4500"/><circle cx="461.64521422270565" cy="897.5483988275407" r="13.757879832972488" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #4203
  </text>

  
</svg>