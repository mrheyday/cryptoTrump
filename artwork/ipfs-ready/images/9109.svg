<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E68C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d6cc72;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#bdb359" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#bdb359" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Rocket --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="754.6902190227394" cy="869.1439757766422" r="5.39638569768541" fill="#FF4500"/><circle cx="921.4758010323725" cy="827.8490485994397" r="13.614811800464876" fill="#FF4500"/><circle cx="827.3503571350625" cy="813.2009058850938" r="14.917951529810104" fill="#FF4500"/><circle cx="717.1142871536509" cy="988.3417304028409" r="13.781235635761659" fill="#FF4500"/><circle cx="137.30213652677415" cy="968.0091638961371" r="10.395691999979892" fill="#FF4500"/><circle cx="231.3767196176617" cy="891.4768401583576" r="7.657953453457251" fill="#FF4500"/><circle cx="928.3918306619421" cy="838.7399576801336" r="8.87760788447834" fill="#FF4500"/><circle cx="374.14097176610375" cy="850.7667657426848" r="8.518604910077261" fill="#FF4500"/><circle cx="883.6766514867298" cy="907.5472400998211" r="13.841673686234323" fill="#FF4500"/><circle cx="706.1039362112142" cy="877.9873897587829" r="11.432365832244969" fill="#FF4500"/><circle cx="639.0134818217334" cy="947.267192205534" r="14.856797590563096" fill="#FF4500"/><circle cx="123.16520543641008" cy="853.547254888849" r="10.966584963256157" fill="#FF4500"/><circle cx="815.6778752371346" cy="876.7644206225012" r="10.634116965048817" fill="#FF4500"/><circle cx="886.8832506935515" cy="961.5477023612395" r="10.413183386580512" fill="#FF4500"/><circle cx="656.2683673886615" cy="853.4738636461543" r="12.165484004129162" fill="#FF4500"/><circle cx="217.80922781958844" cy="835.1055305694192" r="5.8296512902512205" fill="#FF4500"/><circle cx="392.20877098345187" cy="883.8729882617374" r="9.71764270227651" fill="#FF4500"/><circle cx="525.119234836354" cy="953.4092481214981" r="10.157418520159052" fill="#FF4500"/><circle cx="0.9818970674291272" cy="963.5631878961498" r="13.59919541865542" fill="#FF4500"/><circle cx="390.87087966679877" cy="966.0714489064561" r="11.897943019500037" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9109
  </text>

  
</svg>