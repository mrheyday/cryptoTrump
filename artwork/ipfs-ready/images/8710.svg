<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8014;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#FF0000"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#FF0000" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#CC0000" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#d90000" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#d90000" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#d98d21" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 510,425 540,405" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#b26600" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Twitter Bird --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="509.8613177246716" cy="990.9445888941063" r="10.610483915981561" fill="#FF4500"/><circle cx="224.9931980313542" cy="952.3491491768802" r="14.636923018035134" fill="#FF4500"/><circle cx="871.0852957840824" cy="988.1171666558038" r="13.589596795756517" fill="#FF4500"/><circle cx="285.64853870401816" cy="867.6424209326169" r="8.607574384955415" fill="#FF4500"/><circle cx="650.9145887436824" cy="995.9090471485191" r="7.909524337835112" fill="#FF4500"/><circle cx="534.6343254690429" cy="805.3049985712827" r="10.220724289807979" fill="#FF4500"/><circle cx="195.81941454481046" cy="815.7010230814251" r="14.684412694432938" fill="#FF4500"/><circle cx="526.1636500917313" cy="961.7071807054808" r="7.924988257292085" fill="#FF4500"/><circle cx="308.0225238669878" cy="863.2078726646188" r="8.857904090578113" fill="#FF4500"/><circle cx="726.110512494673" cy="862.2379918157116" r="10.622318416605179" fill="#FF4500"/><circle cx="821.1709174864408" cy="926.2696978134272" r="11.528537474925546" fill="#FF4500"/><circle cx="420.2703921622932" cy="941.3615338760874" r="5.607894878331063" fill="#FF4500"/><circle cx="883.6693348007738" cy="928.968650907253" r="11.952732844194449" fill="#FF4500"/><circle cx="460.0629353958103" cy="875.2338801012235" r="11.4879313688067" fill="#FF4500"/><circle cx="981.7260219541262" cy="945.9250188948095" r="14.755721426816429" fill="#FF4500"/><circle cx="147.39568214956432" cy="856.1835195807256" r="12.485687891240449" fill="#FF4500"/><circle cx="900.7937764646721" cy="810.9934649583545" r="13.816790537721245" fill="#FF4500"/><circle cx="461.98933111185437" cy="871.3367671922348" r="11.716169883331975" fill="#FF4500"/><circle cx="718.4099819114174" cy="851.3733474321878" r="12.296013473886628" fill="#FF4500"/><circle cx="98.4666486324548" cy="894.3319763336506" r="11.032643337304604" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #8710
  </text>

  
</svg>