<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="skinGradient">
      <stop offset="0%" style="stop-color:#CD7F32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a4c00;stop-opacity:1" />
    </radialGradient>

    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5bd00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="1000" fill="#808080"/>
  

  <!-- Body/Outfit Layer -->
  
      <g id="outfit">
        <!-- Suit Shoulders -->
        <rect x="250" y="550" width="500" height="400" fill="#2F4F4F" rx="20"/>

        <!-- Tie -->
        <polygon points="500,600 460,630 500,850 540,630" fill="#003366" />

        <!-- Shirt -->
        <rect x="400" y="570" width="200" height="100" fill="white"/>

        <!-- Suit Lapels -->
        <polygon points="400,590 300,750 350,800 420,630" fill="#092929" />
        <polygon points="600,590 700,750 650,800 580,630" fill="#092929" />
      </g>

  <!-- Face/Skin Layer -->
  
      <g id="face">
        <!-- Head -->
        <ellipse cx="500" cy="350" rx="180" ry="220" fill="url(#skinGradient)"/>

        <!-- Eyes -->
        <ellipse cx="450" cy="330" rx="15" ry="20" fill="white"/>
        <ellipse cx="550" cy="330" rx="15" ry="20" fill="white"/>
        <circle cx="450" cy="335" r="8" fill="#003366"/>
        <circle cx="550" cy="335" r="8" fill="#003366"/>

        <!-- Nose -->
        <path d="M 490,370 Q 500,390 510,370" fill="none" stroke="#a7590c" stroke-width="2"/>

        <!-- Mouth -->
        <path d="M 460,410 Q 500,420 540,410" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>

        <!-- Eyebrows -->
        <path d="M 430,300 Q 450,290 470,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
        <path d="M 570,300 Q 550,290 530,300" fill="none" stroke="#803200" stroke-width="4" stroke-linecap="round"/>
      </g>

  <!-- Hair Layer -->
  
      <g id="hair">
        <!-- Main Hair Mass -->
        <ellipse cx="500" cy="220" rx="200" ry="80" fill="url(#hairGradient)"/>

        <!-- Signature Swoop -->
        <path d="M 320,220 Q 400,160 550,180 Q 650,190 680,230"
              fill="url(#hairGradient)" opacity="0.9"/>

        <!-- Hair Texture Lines -->
        <path d="M 350,200 Q 420,170 500,185"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>
        <path d="M 400,210 Q 470,175 540,190"
              fill="none" stroke="#cca400" stroke-width="2" opacity="0.6"/>

        
      </g>

  <!-- Accessory Layer -->
  <g id="accessory"><!-- Golf Club --></g>

  <!-- Special Effect Layer -->
  
        <g id="specialEffect" opacity="0.4">
          <circle cx="722.774935691298" cy="922.5153645383803" r="7.759185566303111" fill="#FF4500"/><circle cx="960.1108805608341" cy="891.3176722394988" r="14.49215596620217" fill="#FF4500"/><circle cx="773.267118300544" cy="858.9098092563592" r="9.76314071804573" fill="#FF4500"/><circle cx="963.6341611750065" cy="829.6840826637501" r="12.49079534525887" fill="#FF4500"/><circle cx="180.08617118290582" cy="832.8287776430673" r="13.977295300891077" fill="#FF4500"/><circle cx="857.3188685442636" cy="828.7848735637465" r="13.503711046343035" fill="#FF4500"/><circle cx="962.2725195973978" cy="993.7598191106051" r="13.898212995274639" fill="#FF4500"/><circle cx="208.52289411084212" cy="958.6363820035428" r="5.122942937132295" fill="#FF4500"/><circle cx="142.67528956766307" cy="988.1530247126851" r="6.524989663855914" fill="#FF4500"/><circle cx="974.8382352677534" cy="869.6672089078473" r="9.171097528198311" fill="#FF4500"/><circle cx="893.7022876290033" cy="917.5096296151668" r="9.09271108733086" fill="#FF4500"/><circle cx="428.5444528333813" cy="841.3921879180831" r="12.817029276274138" fill="#FF4500"/><circle cx="106.78077875633663" cy="943.7387560219286" r="7.6102043013866165" fill="#FF4500"/><circle cx="190.43114505176172" cy="928.1219201092895" r="6.224867643803032" fill="#FF4500"/><circle cx="502.17041551573914" cy="948.6620934318594" r="12.6170444664452" fill="#FF4500"/><circle cx="664.9500324622044" cy="992.2485976309121" r="11.391263009505328" fill="#FF4500"/><circle cx="969.8795302957872" cy="856.1609629919468" r="8.98451942179185" fill="#FF4500"/><circle cx="962.7204129527198" cy="815.3261307548563" r="10.989039555515674" fill="#FF4500"/><circle cx="644.1466593366476" cy="924.4683178981505" r="8.98207501378212" fill="#FF4500"/><circle cx="851.3191773942804" cy="843.6854015957292" r="6.32822060909461" fill="#FF4500"/>
        </g>

  <!-- Token ID Text -->
  <text x="950" y="970" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="end" opacity="0.7">
    #9763
  </text>

  
</svg>